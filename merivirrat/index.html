<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maailman meret – merialueet ja merivirrat</title>
<style>
  :root{
    --sea:#cfe6f2; --sea-deep:#b7d8ea; --land:#efe4cc; --land-line:#c9b98f;
    --ink:#1c2a36; --muted:#5b6b78; --page:#f7f9fb; --panel:#ffffff;
    --warm:#d1452b; --cold:#2757a8; --focus:#f2b134;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.45}
  header{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;padding:18px 22px 6px}
  h1{font-size:26px;margin:0;font-weight:600;letter-spacing:-.01em}
  header p{margin:0;color:var(--muted);font-size:15px}
  nav{display:flex;gap:6px;padding:8px 22px 10px;flex-wrap:wrap;align-items:center}
  nav .grp{align-self:center;font-size:13px;color:var(--muted);margin-left:10px;padding-right:2px}
  nav .grp::after{content:":"}
  nav button{border:1px solid #d4dbe1;background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
  nav button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  nav button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:0 22px 22px}
  @media (max-width:860px){main{grid-template-columns:1fr}}
  .map{background:var(--sea);border:1px solid #b9cfdc;border-radius:6px;overflow:hidden}
  svg{display:block;width:100%;height:auto}
  .land{fill:var(--land);stroke:var(--land-line);stroke-width:.8}
  .clbl{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;fill:#8a7a55;opacity:.8;pointer-events:none}
  .grid{stroke:#7a9bb0;stroke-width:.8;stroke-dasharray:3 5;fill:none}
  .equator{stroke:#5d7f95;stroke-dasharray:none}
  .current{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;cursor:pointer;transition:opacity .2s}
  .current.warm{stroke:var(--warm)} .current.cold{stroke:var(--cold)}
  .current.counter{stroke-dasharray:8 7;stroke-width:4}
  .hit{fill:none;stroke:transparent;stroke-width:22;cursor:pointer}
  .flow{fill:none;stroke:#fff;stroke-width:1.6;stroke-dasharray:4 14;stroke-linecap:round;pointer-events:none;opacity:.85;animation:flow 1.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  g.cur.dim .current,g.cur.dim .flow{opacity:.18}
  g.cur.neutral .current{stroke:#7d8d99}
  g.cur.active .current{stroke-width:7;filter:drop-shadow(0 0 3px rgba(0,0,0,.35))}
  .lbl{font-size:11.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
  .lbl.hidden{display:none}
  .arrow{fill:currentColor}
  aside{background:var(--panel);border:1px solid #e1e7ec;border-radius:6px;padding:16px 18px;min-height:220px}
  aside h2{margin:0 0 4px;font-size:20px;font-weight:600}
  .tag{display:inline-block;font-size:13px;padding:2px 9px;border-radius:999px;color:#fff;margin-bottom:10px}
  .tag.warm{background:var(--warm)} .tag.cold{background:var(--cold)}
  aside p{margin:0 0 10px;font-size:14.5px}
  .quiz-q{font-size:18px;font-weight:600;margin:6px 0 12px}
  .score{color:var(--muted);font-size:14px}
  .feedback{padding:10px 12px;border-radius:6px;font-size:14.5px;margin-top:10px}
  .feedback.ok{background:#e4f3e6;color:#1f5e2b} .feedback.no{background:#fbe6e2;color:#8a2a1a}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .row button,aside > button{border:1px solid #d4dbe1;background:#fff;color:var(--ink);padding:8px 14px;border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
  .row button.warm{border-color:var(--warm);color:var(--warm)} .row button.cold{border-color:var(--cold);color:var(--cold)}
  .row button:focus-visible,aside > button:focus-visible{outline:3px solid var(--focus)}
  .legend{display:flex;gap:16px;font-size:13px;color:var(--muted);padding:4px 0 6px;flex-wrap:wrap}
  .legend span::before{content:"";display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
  .legend .s::before{background:var(--sea-deep);border:1px solid #4f7f9c;height:10px;width:10px;border-radius:50%}
  .legend .o::before{border-top:2px dashed #4f7f9c;height:0;background:none}
  .legend .w::before{background:var(--warm)} .legend .c::before{background:var(--cold)}
  .legend .cc::before{background:repeating-linear-gradient(90deg,var(--warm) 0 5px,transparent 5px 9px)}
  g.sea circle{fill:var(--sea-deep);stroke:#4f7f9c;stroke-width:1;cursor:pointer;opacity:.75;transition:opacity .2s;pointer-events:all}
  g.sea.ocean circle{fill:rgba(79,127,156,.06);stroke-dasharray:4 4;opacity:.6}
  g.sea.ocean:hover circle,g.sea.ocean.active circle{fill:rgba(79,127,156,.18)}
  g.sea:hover circle,g.sea.active circle{opacity:1;stroke-width:2.5;stroke:#1b4a68}
  g.sea.dim{opacity:.25}
  .slbl{font-size:10.5px;font-style:italic;fill:#1b4a68;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
  .slbl.hidden{display:none}
  body.hide-seas g.sea{display:none}
  .layers{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 0 4px;font-size:14px;color:var(--muted)}
  details.more{flex-basis:100%;font-size:14px;color:var(--muted)}
  details.more summary{cursor:pointer;width:max-content;padding:4px 0}
  details.more summary:focus-visible{outline:3px solid var(--focus)}
  .practice-list{list-style:none;padding:0;margin:6px 0 0}
  .practice-list button{width:100%;text-align:left;margin-top:6px;padding:8px 12px;border:1px solid #d4dbe1;background:#fff;border-radius:6px;font:inherit;cursor:pointer;color:var(--ink)}
  aside details{margin-top:14px;font-size:14px;color:var(--muted)}
  aside details summary{cursor:pointer}
  .layers label{display:flex;align-items:center;gap:5px;color:var(--ink)}
  .layers .sep{width:1px;height:18px;background:#d4dbe1}
  body.hide-cur g.cur{display:none}
  body.hide-oceans g.sea.ocean{display:none}
  body.hide-small g.sea:not(.ocean){display:none}
  .layers label.sub{font-size:13px;color:var(--muted);margin-left:-4px}
  nav button.flow-btn{border-color:#1f6f8b;color:#1f6f8b}
  nav button.flow-btn[aria-pressed="true"]{background:#1f6f8b;border-color:#1f6f8b;color:#fff}
  .timer{height:6px;background:#e4ebf0;border-radius:3px;overflow:hidden;margin:2px 0 12px}
  .timer i{display:block;height:100%;background:#1f6f8b;width:100%;transition:width 1s linear}
  .stats{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px}
  .stats b{color:var(--ink);font-size:16px}
  .streak{color:#c2641a}
  .kind{font-size:12px;color:var(--muted);margin-top:8px}
  .cheer{font-size:15px;margin-top:8px}
  .cheer.big{font-size:18px;font-weight:600;color:#1f6f8b}
  .review{font-size:14px;margin-top:8px;padding-left:18px}
  .review li{margin:2px 0}
  body.flow g.cur .current{stroke:#7d8d99}
  body.flow g.cur.active .current{stroke-width:7}
  body.flow g.cur.reveal.warm .current{stroke:var(--warm)} body.flow g.cur.reveal.cold .current{stroke:var(--cold)}
  button.lvl{border:1px solid #d4dbe1;background:#fff;border-radius:6px;font:inherit;cursor:pointer;color:var(--ink)}
  button.lvl:hover{border-color:#1f6f8b}
  body.calm .flow{animation:none}
  body.calm g.cur.active .flow{animation:flow 1.4s linear infinite}
  g.sea.known circle{stroke:#2e8b57;fill:#d6efe0}
  g.cur.known .current{stroke:#2e8b57}
  body.flow g.cur.known .current{stroke:#2e8b57}
  .quiz-q .syl{color:var(--muted);font-weight:400}
  .tip{font-size:14px;color:var(--muted);margin-top:6px}
  .support{display:grid;gap:6px;margin-top:8px;font-size:14px;color:var(--ink)}
  .support label{display:flex;gap:6px;align-items:center}
  .support .len{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .support .len label{border:1px solid #d4dbe1;border-radius:999px;padding:3px 10px}
  label.tog{font-size:14px;display:flex;align-items:center;gap:6px;margin-left:auto}
</style>
</head>
<body>
<header>
  <h1>Maailman meret: merialueet ja merivirrat</h1>
</header>
<nav aria-label="Tila">
  <button id="m-explore" aria-pressed="true">Tutki karttaa</button>
  <button id="m-flow" aria-pressed="false" class="flow-btn">Harjoittele</button>
  <details class="more"><summary>Näytä kartalla</summary>
    <div class="layers">
      <label><input type="checkbox" id="showseas" checked> Merialueet</label>
      <label class="sub"><input type="checkbox" id="showoceans" checked> valtameret</label>
      <label class="sub"><input type="checkbox" id="showsmall" checked> muut meret ja lahdet</label>
      <label><input type="checkbox" id="sealabels" checked> – nimet</label>
      <span class="sep"></span>
      <label><input type="checkbox" id="showcur" checked> Merivirrat</label>
      <label><input type="checkbox" id="labels" checked> – nimet</label>
    </div>
    <div class="legend"><span class="s">Merialue</span><span class="o">Valtameri</span><span class="w">Lämmin merivirta</span><span class="c">Kylmä merivirta</span><span class="cc">Päiväntasaajan vastavirta</span></div>
  </details>
</nav>
<main>
  <div class="map"><svg id="map" viewBox="0 0 1000 480" role="img" aria-label="Maailmankartta merivirroilla"></svg></div>
  <aside id="panel"></aside>
</main>

const el=(t,a={})=>{const e=document.createElementNS(N,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const defs=el("defs");
["warm","cold"].forEach(t=>{
  const m=el("marker",{id:"ar-"+t,viewBox:"0 0 10 10",refX:"7",refY:"5",markerWidth:"4",markerHeight:"4",orient:"auto-start-reverse"});
  const p=el("path",{d:"M0,0 L10,5 L0,10 Z",fill:t==="warm"?"#d1452b":"#2757a8"});m.appendChild(p);defs.appendChild(m);
});

});

const smooth=pts=>{ // Catmull-Rom -> cubic bezier
  const p=pts.map(q=>px(...q));if(p.length<3)return "M"+p.map(v=>v.join(",")).join(" L");
  let d="M"+p[0].join(",");
  for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
  return d;
};

  const [lx,ly]=px(...c.label);
  const t=el("text",{x:lx,y:ly,class:"lbl","text-anchor":"middle"});t.textContent=c.name;g.appendChild(t);

const seaRegion={mustameri:"eu",valimeri:"eu",pohjanmeri:"eu",kaspia:"eu",itameri:"eu",norja:"eu",karibia:"na",meksiko:"na",hudson:"na",baffin:"na","labrador-meri":"na",arabia:"ind",bengali:"ind",etelakiina:"asia",koralli:"aus","japani-meri":"asia",bering:"bering"};
const FULL=[0,0,W,H];let vbCur=FULL.slice(),vbAnim=null;
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function zoomTo(box){
  let target=FULL;
  if(box){const [x0,y0]=px(box[0],box[3]),[x1,y1]=px(box[1],box[2]);let w=x1-x0,h=y1-y0;const ar=W/H;
    if(w/h<ar)w=h*ar;else h=w/ar;const cx=(x0+x1)/2,cy=(y0+y1)/2;target=[cx-w/2,cy-h/2,w,h];}
  if(vbAnim)cancelAnimationFrame(vbAnim);
  const from=vbCur.slice(),t0=performance.now(),dur=reduce?0:450;
  const step=t=>{const k=dur?Math.min(1,(t-t0)/dur):1,e=1-Math.pow(1-k,3);vbCur=from.map((v,i)=>v+(target[i]-v)*e);svg.setAttribute("viewBox",vbCur.map(v=>v.toFixed(1)).join(" "));if(k<1)vbAnim=requestAnimationFrame(step);};
  vbAnim=requestAnimationFrame(step);
}
const syl=n=>support.syl?n.replace(/(valta)?(meri|lahti|virta)$/,(m,a,b)=>(a?a+"·":"")+"<span class=\"syl\">·</span>"+b).replace("·<span","<span"):n;
function speak(txt){if(!support.speak||!("speechSynthesis" in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="fi-FI";u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
function markKnown(key,ok){const n=ok?(streaks.get(key)||0)+1:0;streaks.set(key,n);if(n>=3)known.add(key);applyKnown();}
function applyKnown(){const on=support.showKnown;seas.forEach(sd=>seaGroups[sd.id].classList.toggle("known",on&&known.has("s:"+sd.id)));currents.forEach(c=>groups[c.id].classList.toggle("known",on&&known.has("c:"+c.id)&&known.has("t:"+c.id)));}
function neighbourOrder(items){const rest=items.slice();const out=[];let cur=rest.find(q=>q.t.id==="itameri")||rest.find(q=>q.t.id==="golf")||rest[0];
  while(cur){out.push(cur);rest.splice(rest.indexOf(cur),1);if(!rest.length)break;const [lo,la]=cur.t.c||cur.t.label;
    cur=rest.reduce((b,q)=>{const [x,y]=q.t.c||q.t.label;const d=(x-lo)**2+(y-la)**2;return !b||d<b.d?{q,d}:b},null).q;}
  return out;}
function supportPanel(){

function bindSupport(){

// ---------- flow session: mixed questions, 10 minutes, streaks
let FLOW_SECONDS=600;
const cheers={
  ok:["Oikein.","Nappiin.","Juuri niin.","Hyvä.","Osui.","Kyllä.","Sinne se kuuluu."],
  streak:{3:"Kolme putkeen – hyvä rytmi.",5:"Viisi peräkkäin. Nyt tämä alkaa istua.",8:"Kahdeksan! Kartta on selvästi jo päässä.",12:"Kaksitoista putkeen – tämä on jo hallussa.",20:"Kaksikymmentä. Ei enää mitään opittavaa tähän kokeeseen."},
  no:["Ei haittaa – nyt näet sen.","Läheltä. Tämä tulee kohta uudestaan.","Tämä on niitä, jotka jäävät mieleen vasta toisella kerralla.","Katso hetki, mihin se osuu."],
};
const levels={
  perus:{name:"Perus: merialueet",desc:"Vain merialueet. Merivirrat eivät ole mukana.",seas:true,cur:false,temp:false,basic:true},
  perusvirrat:{name:"Perus: merivirrat",desc:"Vain merivirtojen paikat. Väri näkyy vihjeenä, lämpötilaa ei kysytä.",seas:false,cur:true,temp:false,basic:true},
  keski:{name:"Keski",desc:"Merialueet ja merivirtojen paikat. Virtojen väri näkyy vihjeenä.",seas:true,cur:true,temp:false},
  vaikea:{name:"Vaikea",desc:"Kaikki sekaisin, myös lämmin vai kylmä. Virrat ilman värejä.",seas:true,cur:true,temp:true},
};
function buildFlowPool(){
  const L=levels[flow.level],q=[];
  if(L.seas)seas.forEach(sd=>q.push({kind:"sea",t:sd,key:"s:"+sd.id}));
  if(L.cur)currents.forEach(c=>q.push({kind:"cur",t:c,key:"c:"+c.id}));
  if(L.temp)currents.forEach(c=>q.push({kind:"temp",t:c,key:"t:"+c.id}));
  return levels[flow.level].basic?neighbourOrder(q):shuffle(q);
}
function chooseLevel(){
  document.body.classList.remove("flow");setClass(()=>"");setSeaClass(()=>"");
  panel.innerHTML=`<h2>Harjoittele</h2><p>10 minuutin sessio. Valitse taso:</p>`+
    Object.entries(levels).map(([k,L])=>`<button class="lvl" data-l="${k}" style="display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px"><strong>${L.name}</strong><br><span style="font-size:13px;color:var(--muted)">${L.desc}</span></button>`).join("")+
    `<details><summary>Harjoittele yhtä asiaa</summary><ul class="practice-list"><li><button data-m="sea">Etsi merialue</button></li><li><button data-m="name">Etsi merivirta</button></li><li><button data-m="temp">Lämmin vai kylmä?</button></li></ul></details>`+supportPanel();
  bindSupport();zoomTo(null);
  panel.querySelectorAll(".lvl").forEach(b=>{b.onclick=()=>startFlow(b.dataset.l)});
  panel.querySelectorAll("[data-m]").forEach(b=>{b.onclick=()=>setMode(b.dataset.m)});
}
function startFlow(level){
  FLOW_SECONDS=support.minutes*60;document.body.classList.toggle("calm",support.calm);flow.level=level;const L=levels[level];document.body.classList.toggle("flow",L.temp);
  document.getElementById("showseas").checked=L.seas;document.getElementById("showcur").checked=L.cur;
  document.getElementById("showoceans").checked=true;document.getElementById("showsmall").checked=true;
  document.getElementById("sealabels").checked=false;document.getElementById("labels").checked=false;applyLayers();applyLabels();
  Object.assign(flow,{queue:buildFlowPool(),asked:0,right:0,streak:0,best:0,missed:new Map(),left:FLOW_SECONDS,busy:false,q:null,done:false});
  flow.timer=setInterval(()=>{flow.left--;const bar=document.getElementById("tbar");if(bar)bar.style.width=(flow.left/FLOW_SECONDS*100)+"%";const tt=document.getElementById("tleft");if(tt)tt.textContent=fmt(flow.left);if(flow.left<=0)endFlow();},1000);
  nextFlow();
}
const fmt=sec=>`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
function flowHeader(){
  return `<div class="timer"><i id="tbar" style="width:${flow.left/FLOW_SECONDS*100}%"></i></div>
  ${support.calm?"":`<div class="stats"><span>aikaa <b id="tleft">${fmt(flow.left)}</b></span><span>oikein <b>${flow.right}/${flow.asked}</b></span><span class="streak">putki <b>${flow.streak}</b></span></div>`}`;
}
function nextFlow(){
  if(flow.done)return;
  if(!flow.queue.length)flow.queue=buildFlowPool();
  flow.q=flow.queue.shift();flow.busy=false;
  setClass(()=>"");setSeaClass(()=>"");
  const q=flow.q,kindTxt={sea:"merialue",cur:"merivirta",temp:"lämmin vai kylmä"}[q.kind];
  let body="";
  const reg=q.kind==="sea"&&levels[flow.level].basic&&support.zoom?regions[seaRegion[q.t.id]]:null;zoomTo(reg||null);
  speak(q.kind==="temp"?q.t.name+". Lämmin vai kylmä?":"Missä on "+q.t.name+"?");
  if(q.kind==="temp"){
    setClass(x=>x.id===q.t.id?"active":"dim");setSeaClass(()=>"dim");
    body=`<p class="quiz-q">Korostettu virta on ${syl(q.t.name)}. Lämmin vai kylmä?</p><div class="row"><button class="warm" data-a="warm">Lämmin</button><button class="cold" data-a="cold">Kylmä</button></div>`;
  }else{
    body=`<p class="quiz-q">Missä on ${syl(q.t.name)}?</p><p>Klikkaa sitä kartalla.</p>`;
  }
  panel.innerHTML=flowHeader()+body+`<p class="kind">${kindTxt}</p>`;
  panel.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>flowAnswer({temp:b.dataset.a}));
}
function flowAnswer(a){
  if(flow.busy||!flow.q||flow.done)return;
  const q=flow.q;let ok=false,picked="";
  if(q.kind==="sea"){ok=!!a.sea&&a.sea.id===q.t.id;picked=a.sea?a.sea.name:(a.cur?a.cur.name+" (merivirta)":"");}
  else if(q.kind==="cur"){ok=!!a.cur&&a.cur.id===q.t.id;picked=a.cur?a.cur.name:(a.sea?a.sea.name+" (merialue)":"");}
  else if(q.kind==="temp"){if(!a.temp)return;ok=a.temp===q.t.type;}
  else return;
  flow.busy=true;flow.asked++;markKnown(q.key,ok);
  let cheer="";
  if(ok){flow.right++;flow.streak++;flow.best=Math.max(flow.best,flow.streak);
    cheer=cheers.streak[flow.streak]?`<p class="cheer big">${cheers.streak[flow.streak]}</p>`:`<p class="cheer">${cheers.ok[Math.floor(Math.random()*cheers.ok.length)]}</p>`;}
  else{flow.streak=0;flow.missed.set(q.key,(flow.missed.get(q.key)||0)+1);
    const pos=support.calm?0:Math.min(flow.queue.length,3+Math.floor(Math.random()*3));flow.queue.splice(pos,0,q);
    cheer=`<p class="cheer">${cheers.no[Math.floor(Math.random()*cheers.no.length)]}</p>`;}
  // reveal
  if(q.kind==="sea"){setSeaClass(x=>x.id===q.t.id?"active":"dim");setClass(()=>"dim");}
  else{setClass(x=>x.id===q.t.id?"active reveal "+q.t.type:"dim");setSeaClass(()=>"dim");}
  const what=q.kind==="temp"?`${q.t.name} on <strong>${q.t.type==="warm"?"lämmin":"kylmä"}</strong>.`:(ok?`${q.t.name}.`:`Tuo oli ${picked||"eri kohta"}. ${q.t.name} on nyt korostettu.`);
  const tip=(!ok||support.calm)?(q.kind==="sea"?`<p class="tip">${q.t.tip||""}</p>`:`<p class="tip">${q.t.gyre||""}</p>`):"";
  panel.innerHTML=flowHeader()+`<div class="feedback ${ok?"ok":"no"}">${what}</div>`+tip+cheer+`<div class="row"><button id="next">Seuraava</button></div>`;
  const nb=document.getElementById("next");nb.onclick=nextFlow;nb.focus();
  if(!support.calm)setTimeout(()=>{if(flow.q===q&&flow.busy)nextFlow()},ok?1100:2600);
}
function endFlow(){
  flow.done=true;clearInterval(flow.timer);flow.timer=null;setClass(()=>"");setSeaClass(()=>"");
  const acc=flow.asked?Math.round(flow.right/flow.asked*100):0;
  const miss=[...flow.missed.entries()].sort((a,b)=>b[1]-a[1]).slice(0,support.calm?2:4).map(([k])=>{const [kind,id]=k.split(":");const t=kind==="s"?seas.find(x=>x.id===id):currents.find(x=>x.id===id);return `<li>${t.name}${kind==="t"?" (lämmin vai kylmä)":""}</li>`}).join("");
  zoomTo(null);
  const goodKey=[...streaks.entries()].filter(([k,n])=>n>=2).sort((a,b)=>b[1]-a[1])[0];
  const nm=k=>{const [kind,id]=k.split(":");const t=kind==="s"?seas.find(x=>x.id===id):currents.find(x=>x.id===id);return t.name};
  const good=goodKey?`<p><strong>Meni hyvin:</strong> ${nm(goodKey[0])}.</p>`:"";
  const line=acc>=90?"Erinomainen sessio. Seuraava kerta voi olla lyhyempi – tämä on hallussa.":acc>=70?"Vahva sessio. Alla olevat kannattaa katsoa vielä kerran huomenna.":"Hyvä alku. Toinen kymmenen minuutin sessio huomenna tekee tästä pysyvää.";
  panel.innerHTML=`<h2>Sessio tehty</h2><div class="stats"><span>kysymyksiä <b>${flow.asked}</b></span><span>oikein <b>${acc} %</b></span><span class="streak">paras putki <b>${flow.best}</b></span></div><p class="cheer">${line}</p>${good}${miss?`<p><strong>Seuraavaksi:</strong></p><ul class="review">${miss}</ul>`:"<p>Ei yhtään virhettä, jota tarvitsisi kerrata.</p>"}<div class="row"><button id="again">Uusi sessio (${levels[flow.level].name})</button><button id="lvl">Vaihda tasoa</button><button id="explore">Tutki karttaa</button></div>`;
  document.getElementById("again").onclick=()=>startFlow(flow.level);document.getElementById("lvl").onclick=chooseLevel;document.getElementById("explore").onclick=()=>setMode("explore");
}

function askSea(){
  if(quiz.i>=quiz.order.length){panel.innerHTML=`<h2>Valmis</h2><p>Oikein ${quiz.right} / ${quiz.order.length}.</p><div class="row"><button id="again">Uusi kierros</button><button id="back">Takaisin</button></div>`;document.getElementById("again").onclick=()=>setMode("sea");document.getElementById("back").onclick=()=>setMode("flow");setSeaClass(()=>"");return;}
  quiz.locked=false;setSeaClass(()=>"");
  panel.innerHTML=`<h2>Etsi merialue</h2><p class="score">${quiz.i+1} / ${quiz.order.length} · oikein ${quiz.right}</p><p class="quiz-q">Missä on ${quiz.order[quiz.i].name}?</p><p>Klikkaa sitä kartalla.</p>`;
}
function onPickSea(sd){
  if(mode==="flow"){flowAnswer({sea:sd});return;}
  if(mode==="explore"){setSeaClass(x=>x.id===sd.id?"active":"dim");setClass(()=>"dim");panel.innerHTML=`<h2>${sd.name}</h2><p class="tip">${sd.tip||""}</p><p>${sd.why}</p>`;return;}
  if(mode==="sea"){
    if(quiz.locked)return;quiz.locked=true;const target=quiz.order[quiz.i];const ok=sd.id===target.id;if(ok)quiz.right++;
    setSeaClass(x=>x.id===target.id?"active":(x.id===sd.id?"":"dim"));
    panel.innerHTML+=`<div class="feedback ${ok?"ok":"no"}">${ok?"Oikein.":"Ei ihan – tuo oli "+sd.name+"."} ${target.name} on nyt korostettu kartalla.</div><div class="row"><button id="next">Seuraava</button></div>`;
    document.getElementById("next").onclick=()=>{quiz.i++;askSea()};document.getElementById("next").focus();
  }
}
function onPick(c){
  if(mode==="flow"){flowAnswer({cur:c});return;}
  if(mode==="sea")return;
  if(mode==="explore"){setClass(x=>x.id===c.id?"active":"dim");setSeaClass(()=>"dim");showInfo(c);return;}
  if(mode==="name"){
    if(quiz.locked)return;quiz.locked=true;const target=quiz.order[quiz.i];const ok=c.id===target.id;if(ok)quiz.right++;
    setClass(x=>x.id===target.id?"active":(x.id===c.id?"":"dim"));
    panel.innerHTML+=`<div class="feedback ${ok?"ok":"no"}">${ok?"Oikein.":"Ei ihan – tuo oli "+c.name+"."} ${target.name} on nyt korostettu kartalla.</div><div class="row"><button id="next">Seuraava</button></div>`;
    document.getElementById("next").onclick=()=>{quiz.i++;askName()};document.getElementById("next").focus();return;
  }
  if(mode==="temp"){
    if(quiz.answered.has(c.id)){showInfo(c);return;}
    setClass(x=>quiz.answered.has(x.id)?(x.id===c.id?"active":""):(x.id===c.id?"neutral active":"neutral"));
    panel.innerHTML=`<h2>${c.name}</h2><p>Katso, mistä se tulee ja minne se menee. Onko vesi lämmintä vai kylmää?</p><div class="row"><button class="warm" data-a="warm">Lämmin</button><button class="cold" data-a="cold">Kylmä</button></div><p class="score">Vastattu ${quiz.answered.size} / ${currents.length}</p>`;
    panel.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.a===c.type;quiz.answered.add(c.id);if(ok)quiz.right++;
      setClass(x=>quiz.answered.has(x.id)?(x.id===c.id?"active":""):"neutral");
      const done=quiz.answered.size===currents.length;
      panel.innerHTML=`<h2>${c.name}</h2><span class="tag ${c.type}">${c.type==="warm"?"Lämmin":"Kylmä"} merivirta</span><div class="feedback ${ok?"ok":"no"}">${ok?"Oikein.":"Ei – se on "+(c.type==="warm"?"lämmin":"kylmä")+"."}</div><p style="margin-top:10px">${c.why}</p><p class="score">${done?`Kaikki tehty: ${quiz.right} / ${currents.length} oikein.`:`Vastattu ${quiz.answered.size} / ${currents.length}. Klikkaa seuraavaa harmaata virtaa.`}</p>${done?'<button id="again">Uusi kierros</button>':""}`;
      const a=document.getElementById("again");if(a)a.onclick=()=>setMode("temp");
    });
  }
}
function showInfo(c){panel.innerHTML=`<h2>${c.name}</h2><span class="tag ${c.type}">${c.type==="warm"?"Lämmin":"Kylmä"} merivirta</span><p class="tip">${c.gyre||""}</p><p>${c.why}</p>`;}
setMode("explore");
</script>
</body>
</html>
