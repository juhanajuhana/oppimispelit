  {t:"mc",th:"planeetta",lvl:2,q:"Mitä tapahtuu tasauspäivänä?",a:"Päivä ja yö ovat 12 tuntia kaikkialla, aurinko zeniitissä päiväntasaajalla",w:["Aurinko on zeniitissä Kravun kääntöpiirillä","Pohjoisessa on vuoden pisin päivä","Napapiirillä alkaa kaamos"],why:"Tasauspäivät 20.–21.3. ja 22.–23.9. Silloin kumpikaan pallonpuolisko ei ole kallellaan aurinkoa kohti."},
  {t:"mc",th:"planeetta",lvl:2,q:"Millä leveyspiirillä aurinko on zeniitissä 21.6.?",a:"Kravun kääntöpiirillä 23,5° N",w:["Päiväntasaajalla","Kauriin kääntöpiirillä 23,5° S","Pohjoisella napapiirillä"],why:"Kesäpäivänseisauksena pohjoinen napa on kallellaan aurinkoa kohti ja aurinko käy zeniitissä Kravun kääntöpiirillä."},
  {t:"mc",th:"planeetta",lvl:3,q:"Millä leveyspiirillä aurinko on zeniitissä 21.12.?",a:"Kauriin kääntöpiirillä 23,5° S",w:["Kravun kääntöpiirillä 23,5° N","Päiväntasaajalla","Eteläisellä napapiirillä"],why:"Talvipäivänseisauksena eteläinen pallonpuolisko on kallellaan aurinkoa kohti."},
  {t:"mc",th:"planeetta",lvl:2,q:"Missä on yötön yö 21.6.?",a:"Pohjoisen napapiirin pohjoispuolella",w:["Kravun kääntöpiirin pohjoispuolella","Päiväntasaajalla","Eteläisen napapiirin eteläpuolella"],why:"Napapiiri 66,5° N on raja: sen pohjoispuolella aurinko ei laske kesäpäivänseisauksena. Etelänavalla on samaan aikaan kaamos."},
  {t:"mc",th:"planeetta",lvl:1,q:"Mitkä leveyspiirit rajaavat tropiikin?",a:"Kravun ja Kauriin kääntöpiirit (23,5° N ja S)",w:["Napapiirit (66,5°)","Päiväntasaaja ja kääntöpiiri","Kääntöpiiri ja napapiiri"],why:"Tropiikki = kuuma vyöhyke kääntöpiirien välissä."},
  {t:"mc",th:"planeetta",lvl:1,q:"Mitkä leveyspiirit rajaavat lauhkean vyöhykkeen?",a:"Kääntöpiiri (23,5°) ja napapiiri (66,5°)",w:["Päiväntasaaja ja kääntöpiiri","Napapiiri ja napa","Kravun ja Kauriin kääntöpiirit"],why:"Lauhkea vyöhyke on kääntöpiirin ja napapiirin välissä, molemmilla pallonpuoliskoilla."},
  {t:"mc",th:"planeetta",lvl:2,q:"Millä vyöhykkeellä aurinko käy zeniitissä vähintään kerran vuodessa?",a:"Tropiikissa",w:["Lauhkealla vyöhykkeellä","Kylmällä vyöhykkeellä","Kaikilla vyöhykkeillä"],why:"Zeniitti = suoraan yläpuolella. Mahdollista vain kääntöpiirien välissä."},
  {t:"mc",th:"planeetta",lvl:2,q:"Mikä kuvaa lauhkean vyöhykkeen valaistusta?",a:"Ei zeniittiä, ei yötöntä yötä eikä kaamosta; päivän pituus vaihtelee paljon",w:["Päivä on aina 12 tuntia","Kesällä yötön yö, talvella kaamos","Aurinko zeniitissä kahdesti vuodessa"],why:"Lauhkealla vyöhykkeellä on neljä vuodenaikaa, koska päivän pituus ja auringon korkeus vaihtelevat selvästi."},
  {t:"mc",th:"planeetta",lvl:2,q:"Mikä kuvaa kylmän vyöhykkeen valaistusta?",a:"Kesällä yötön yö, talvella kaamos, aurinko aina matalalla",w:["Päivä on aina 12 tuntia","Aurinko zeniitissä kerran vuodessa","Neljä tasaista vuodenaikaa"],why:"Napapiirin ja navan välissä. Navoilla yötön yö ja kaamos kestävät puoli vuotta."},
  {t:"mc",th:"planeetta",lvl:3,q:"Miksi tropiikissa on kuuma ympäri vuoden?",a:"Säteily tulee jyrkästi ja päivä on aina noin 12 h",w:["Se on lähempänä aurinkoa","Siellä ei ole tuulia","Ilmakehä on siellä ohuempi"],why:"Jyrkkä tulokulma keskittää energian pienelle alalle, eikä vuodenaikoja juuri ole."},
  {t:"mc",th:"planeetta",lvl:3,q:"Miksi napapiiri on juuri 66,5°?",a:"90° − 23,5° = 66,5°: se seuraa akselin kaltevuudesta",w:["Se on sovittu kansainvälisesti","Se on Rovaniemen leveysaste","Se on puolet 133°:sta"],why:"Kaltevuus 23,5° määrää sekä kääntöpiirit (23,5°) että napapiirit (90° − 23,5°)."},
  {t:"mc",th:"planeetta",lvl:3,q:"Mikä ilmiö EI johdu maapallon pyörimisestä?",a:"Vuodenajat",w:["Coriolis-ilmiö","Vuorokausi","Aikavyöhykkeet"],why:"Vuodenajat johtuvat kierrosta auringon ympäri ja akselin kaltevuudesta."},
  {t:"order",th:"planeetta",lvl:2,q:"Järjestä vuoden tapahtumat tammikuusta alkaen.",items:["Kevätpäiväntasaus 20.–21.3.","Kesäpäivänseisaus 21.–22.6.","Syyspäiväntasaus 22.–23.9.","Talvipäivänseisaus 21.–22.12."],why:"Tasaus – seisaus – tasaus – seisaus, noin kolmen kuukauden välein."},
  {t:"order",th:"planeetta",lvl:2,q:"Järjestä leveyspiirit päiväntasaajalta pohjoisnavalle.",items:["Päiväntasaaja 0°","Kravun kääntöpiiri 23,5° N","Pohjoinen napapiiri 66,5° N","Pohjoisnapa 90° N"],why:"0° – 23,5° – 66,5° – 90°. Kääntöpiiri rajaa tropiikin, napapiiri kylmän vyöhykkeen."},
  {t:"label",th:"planeetta",lvl:1,dg:"valo",target:"kravun",q:"Klikkaa Kravun kääntöpiiriä.",why:"23,5° N, päiväntasaajan pohjoispuolella."},
  {t:"label",th:"planeetta",lvl:1,dg:"valo",target:"kauriin",q:"Klikkaa Kauriin kääntöpiiriä.",why:"23,5° S, päiväntasaajan eteläpuolella."},
  {t:"label",th:"planeetta",lvl:1,dg:"valo",target:"napapiiriN",q:"Klikkaa pohjoista napapiiriä.",why:"66,5° N. Sen pohjoispuolella on yötön yö ja kaamos."},
  {t:"label",th:"planeetta",lvl:1,dg:"valo",target:"tropiikki",q:"Klikkaa tropiikkia.",why:"Kääntöpiirien välinen kuuma vyöhyke."},
  {t:"label",th:"planeetta",lvl:2,dg:"valo",target:"lauhkeaN",q:"Klikkaa pohjoista lauhkeaa vyöhykettä.",why:"Kravun kääntöpiiristä pohjoiselle napapiirille."},
  {t:"label",th:"planeetta",lvl:2,dg:"valo",target:"kylmaS",q:"Klikkaa eteläistä kylmää vyöhykettä.",why:"Eteläiseltä napapiiriltä etelänavalle: Etelämanner."},
  {t:"label",th:"planeetta",lvl:2,dg:"valo",target:"paivantasaaja",q:"Klikkaa leveyspiiriä, jolla päivä ja yö ovat aina 12 tuntia.",why:"Päiväntasaaja."},
  {t:"label",th:"planeetta",lvl:3,dg:"valo",target:"kravun",q:"Klikkaa leveyspiiriä, jolla aurinko on zeniitissä 21.6.",why:"Kravun kääntöpiiri 23,5° N."},
  {t:"label",th:"planeetta",lvl:3,dg:"valo",target:"kylmaN",q:"Klikkaa vyöhykettä, jolla on kaamos joulukuussa.",why:"Pohjoinen kylmä vyöhyke napapiirin pohjoispuolella."},
  {t:"label",th:"planeetta",lvl:1,dg:"vuosi",target:"kesa",q:"Klikkaa kesäpäivänseisausta.",why:"Pohjoinen napa on kallellaan aurinkoa kohti: 21.–22.6."},
  {t:"label",th:"planeetta",lvl:2,dg:"vuosi",target:"talvi",q:"Klikkaa kohtaa, jossa pohjoisessa on vuoden lyhin päivä.",why:"Talvipäivänseisaus 21.–22.12.: pohjoinen napa poispäin auringosta."},
  {t:"label",th:"planeetta",lvl:3,dg:"vuosi",target:"kevat",q:"Klikkaa kevätpäiväntasausta.",why:"20.–21.3.: aurinko zeniitissä päiväntasaajalla, kumpikaan napa ei ole kallellaan aurinkoa kohti."},

  // ===== ilmakehä
  {t:"mc",th:"ilmakeha",lvl:1,q:"Missä kerroksessa sää syntyy?",a:"Troposfäärissä",w:["Stratosfäärissä","Mesosfäärissä","Termosfäärissä"],why:"Alin kerros sisältää lähes kaiken vesihöyryn: pilvet, sade ja tuulet."},
  {t:"mc",th:"ilmakeha",lvl:1,q:"Missä kerroksessa otsonikerros on?",a:"Stratosfäärissä",w:["Troposfäärissä","Mesosfäärissä","Termosfäärissä"],why:"Otsonikerros on 15–35 km korkeudessa stratosfäärissä."},
  {t:"mc",th:"ilmakeha",lvl:1,q:"Missä kerroksessa meteorit palavat?",a:"Mesosfäärissä",w:["Troposfäärissä","Stratosfäärissä","Eksosfäärissä"],why:"Mesosfääri 50–85 km, ilmakehän kylmin kerros: tähdenlennot."},
  {t:"mc",th:"ilmakeha",lvl:1,q:"Missä kerroksessa revontulet syntyvät?",a:"Termosfäärissä",w:["Troposfäärissä","Stratosfäärissä","Mesosfäärissä"],why:"Revontulet syntyvät 100–300 km korkeudessa termosfäärissä."},
  {t:"mc",th:"ilmakeha",lvl:2,q:"Miten lämpötila muuttuu troposfäärissä ylöspäin?",a:"Laskee, noin 6,5 °C kilometriä kohti",w:["Nousee","Pysyy samana","Laskee vain yöllä"],why:"Maanpinta lämmittää ilman alhaalta. Siksi vuorilla on kylmä."},
  {t:"mc",th:"ilmakeha",lvl:2,q:"Miksi lämpötila nousee stratosfäärissä?",a:"Otsoni imee auringon UV-säteilyä",w:["Maanpinta lämmittää sitä","Meteorit palavat siellä","Ilma on siellä tiheämpää"],why:"UV-säteilyn energia lämmittää otsonikerrosta."},
  {t:"mc",th:"ilmakeha",lvl:2,q:"Mihin kerrokseen ilmakehän jako perustuu?",a:"Lämpötilan muutokseen korkeuden mukaan",w:["Ilmanpaineeseen","Kaasujen määrään","Pilvien korkeuteen"],why:"Laskee – nousee – laskee – nousee. Rajat ovat 'paussit'."},
  {t:"mc",th:"ilmakeha",lvl:3,q:"Miksi termosfäärin satojen asteiden lämpötilaa ei tuntisi?",a:"Ilma on niin harvaa, että molekyylejä on hyvin vähän",w:["Se on liian korkealla mitattavaksi","Siellä on aina pimeää","Revontulet viilentävät sitä"],why:"Lämpötila kuvaa molekyylien nopeutta, mutta lämpöä siirtyy vain, kun molekyylejä on paljon."},
  {t:"mc",th:"ilmakeha",lvl:2,q:"Missä kerroksessa matkustajakoneet lentävät?",a:"Troposfäärin yläosassa ja stratosfäärin alaosassa",w:["Mesosfäärissä","Termosfäärissä","Eksosfäärissä"],why:"Noin 10–12 km: tropopaussin tuntumassa, sään yläpuolella."},
  {t:"mc",th:"ilmakeha",lvl:1,q:"Mikä on ilmakehän tärkein merkitys lämpötilalle?",a:"Kasvihuoneilmiö pitää keskilämpötilan +15 °C:ssa",w:["Se viilentää maapalloa −18 °C:een","Se estää auringon paistamasta","Se tekee yöt lämpimämmiksi kuin päivät"],why:"Ilman ilmakehää keskilämpötila olisi −18 °C. Vesihöyry ja hiilidioksidi pidättävät lämpöä."},
  {t:"mc",th:"ilmakeha",lvl:2,q:"Miltä ilmakehä suojaa maapalloa?",a:"UV-säteilyltä, kosmiselta säteilyltä ja meteoreilta",w:["Vain sateelta","Kuun vetovoimalta","Maanjäristyksiltä"],why:"Otsoni imee UV:n, meteorit palavat mesosfäärissä."},
  {t:"mc",th:"ilmakeha",lvl:2,q:"Mitkä ovat ilmakehän kaksi yleisintä kaasua?",a:"Typpi (78 %) ja happi (21 %)",w:["Happi ja hiilidioksidi","Typpi ja vesihöyry","Hiilidioksidi ja argon"],why:"Hiilidioksidia on vain 0,04 %, mutta se on tärkeä kasvihuonekaasu."},
  {t:"mc",th:"ilmakeha",lvl:1,q:"Mitä otsonikerros tekee?",a:"Imee auringon haitallisen UV-säteilyn",w:["Pidättää lämpöä","Tuottaa happea","Synnyttää revontulet"],why:"Ilman otsonikerrosta UV aiheuttaisi ihosyöpää ja tuhoaisi kasviplanktonia."},
  {t:"mc",th:"ilmakeha",lvl:2,q:"Mikä on otsoni?",a:"Kolmiatominen happi O₃",w:["Kaksiatominen happi O₂","Hiilidioksidi CO₂","Typen yhdiste"],why:"Otsoni syntyy stratosfäärissä UV-säteilyn vaikutuksesta hapesta."},
  {t:"mc",th:"ilmakeha",lvl:2,q:"Mikä ohensi otsonikerrosta?",a:"CFC-yhdisteet (freonit) kylmälaitteista ja suihkepulloista",w:["Hiilidioksidi autoista","Tulivuorten tuhka","Lentokoneiden melu"],why:"Montrealin pöytäkirja 1987 kielsi CFC:t, ja kerros elpyy hitaasti."},
  {t:"mc",th:"ilmakeha",lvl:3,q:"Missä otsoniaukko on?",a:"Etelämantereen yllä, erityisesti keväällä",w:["Päiväntasaajan yllä","Saharan yllä","Suomen yllä kesällä"],why:"Etelämantereen kylmä talvi-ilma tehostaa CFC:iden otsonia hajottavaa vaikutusta keväällä."},
  {t:"mc",th:"ilmakeha",lvl:3,q:"Miten otsonikato ja ilmastonmuutos liittyvät toisiinsa?",a:"Ne ovat eri ongelmia: otsonikato lisää UV-säteilyä, ilmastonmuutos lämmittää",w:["Otsoniaukko päästää lämmön karkuun avaruuteen","Ne ovat sama asia","Otsoniaukko aiheuttaa ilmastonmuutoksen"],why:"Yleinen sekaannus kokeessa. Otsoni = UV-suoja, kasvihuonekaasut = lämpö."},
  {t:"mc",th:"ilmakeha",lvl:3,q:"Missä otsoni on haitallinen?",a:"Troposfäärissä, jossa se on savusumun saaste",w:["Stratosfäärissä","Mesosfäärissä","Se ei ole koskaan haitallinen"],why:"Sama kaasu: ylhäällä suoja, alhaalla hengitysteitä ärsyttävä saaste."},
  {t:"order",th:"ilmakeha",lvl:1,q:"Järjestä ilmakehän kerrokset alhaalta ylös.",items:["Troposfääri","Stratosfääri","Mesosfääri","Termosfääri","Eksosfääri"],why:"Tropo – strato – meso – termo – ekso. Muistisääntö: 'Tässä Sataa Meillä Tänään Eniten'."},
  {t:"order",th:"ilmakeha",lvl:3,q:"Järjestä lämpötilan muutokset alhaalta ylös.",items:["Laskee (troposfääri)","Nousee (stratosfääri)","Laskee (mesosfääri)","Nousee (termosfääri)"],why:"Laskee – nousee – laskee – nousee."},
  {t:"label",th:"ilmakeha",lvl:1,dg:"ilmakeha",target:"tropo",q:"Klikkaa kerrosta, jossa pilvet ja sade ovat.",why:"Troposfääri, alin kerros."},
  {t:"label",th:"ilmakeha",lvl:1,dg:"ilmakeha",target:"otsoni",q:"Klikkaa otsonikerrosta.",why:"Stratosfäärissä 15–35 km."},
  {t:"label",th:"ilmakeha",lvl:2,dg:"ilmakeha",target:"meso",q:"Klikkaa ilmakehän kylmintä kerrosta.",why:"Mesosfääri, jopa −90 °C."},
  {t:"label",th:"ilmakeha",lvl:2,dg:"ilmakeha",target:"termo",q:"Klikkaa kerrosta, jossa revontulet syntyvät.",why:"Termosfääri."},
  {t:"label",th:"ilmakeha",lvl:3,dg:"ilmakeha",target:"strato",q:"Klikkaa kerrosta, jossa lämpötila nousee UV-säteilyn takia.",why:"Stratosfääri: otsoni imee UV:n."},
  {t:"label",th:"ilmakeha",lvl:3,dg:"ilmakeha",target:"ekso",q:"Klikkaa uloimman kerroksen kohtaa.",why:"Eksosfääri, yli 500 km."},

  // ===== tuulet
  {t:"mc",th:"tuulet",lvl:1,q:"Mistä mihin tuuli puhaltaa?",a:"Korkeapaineesta matalapaineeseen",w:["Matalapaineesta korkeapaineeseen","Aina lännestä itään","Aina mereltä maalle"],why:"Ilma virtaa paine-eron tasoittamiseksi korkeasta matalaan."},
  {t:"mc",th:"tuulet",lvl:1,q:"Mikä synnyttää paine-erot?",a:"Auringon epätasainen lämmitys: lämmin ilma kohoaa, kylmä laskeutuu",w:["Kuun vetovoima","Merivirrat","Maapallon pyöriminen yksin"],why:"Lämmin ilma laajenee ja kohoaa → matalapaine. Kylmä ilma tiivistyy ja laskeutuu → korkeapaine."},
  {t:"mc",th:"tuulet",lvl:2,q:"Missä paine on matala?",a:"Siellä, missä lämmin ilma kohoaa",w:["Siellä, missä kylmä ilma laskeutuu","Aina navoilla","Aina merellä"],why:"Kohoava ilma keventää painetta pinnalla. Päiväntasaaja ja 60° ovat matalapaineen vyöhykkeitä."},
  {t:"mc",th:"tuulet",lvl:2,q:"Milloin tuuli on kovaa?",a:"Kun paine-ero on suuri eli isobaarit ovat tiheässä",w:["Kun ilmanpaine on korkea","Kun on lämmintä","Kun isobaarit ovat harvassa"],why:"Suuri paine-ero lyhyellä matkalla = kova tuuli."},
  {t:"mc",th:"tuulet",lvl:2,q:"Miksi merituuli puhaltaa päivällä mereltä maalle?",a:"Maa lämpenee nopeammin, ilma kohoaa ja maalle syntyy matalapaine",w:["Meri on päivällä lämpimämpi kuin maa","Aallot työntävät ilmaa","Coriolis-ilmiö vetää ilmaa maalle"],why:"Yöllä päinvastoin: maa jäähtyy nopeammin ja maatuuli puhaltaa merelle."},
  {t:"mc",th:"tuulet",lvl:1,q:"Millainen paine on päiväntasaajalla?",a:"Matalapaine: lämmin kostea ilma kohoaa",w:["Korkeapaine: kylmä ilma laskeutuu","Vaihtelee joka päivä","Ei painetta lainkaan"],why:"Aurinko lämmittää eniten päiväntasaajaa. Kohoava ilma tuo päivittäisiä sateita."},
  {t:"mc",th:"tuulet",lvl:1,q:"Millainen paine on kääntöpiirien seudulla (30°)?",a:"Korkeapaine: laskeva kuiva ilma",w:["Matalapaine: kohoava ilma","Sama kuin päiväntasaajalla","Polaaririntama"],why:"Päiväntasaajalta kohonnut ilma laskeutuu 30°:n kohdalla. Siksi siellä on aavikot."},
  {t:"mc",th:"tuulet",lvl:2,q:"Millainen paine on 60° leveydellä?",a:"Matalapaine: polaaririntama, jossa lämmin ja kylmä ilma kohtaavat",w:["Korkeapaine","Pasaatituulten vyöhyke","Tyvenet"],why:"Lämmin ilma nousee kylmän päälle → syklonit. Islannin matalapaine tuo Suomeen sateet."},
  {t:"mc",th:"tuulet",lvl:1,q:"Mitkä tuulet puhaltavat kääntöpiireiltä päiväntasaajalle?",a:"Pasaatituulet",w:["Länsituulet","Polaariset itätuulet","Monsuunit"],why:"Koillispasaati pohjoisessa, kaakkoispasaati etelässä."},
  {t:"mc",th:"tuulet",lvl:1,q:"Millä tuulivyöhykkeellä Suomi on?",a:"Länsituulten vyöhykkeellä (30°–60°)",w:["Pasaatituulten vyöhykkeellä","Polaaristen itätuulten vyöhykkeellä","Tyvenillä"],why:"Länsituulet tuovat Suomeen Atlantin lämmön ja syklonit."},
  {t:"mc",th:"tuulet",lvl:2,q:"Miksi pohjoisen pasaati tulee koillisesta eikä pohjoisesta?",a:"Coriolis-ilmiö kääntää tuulen oikealle",w:["Mantereet kääntävät sen","Aurinko lämmittää idästä","Pasaati tulee pohjoisesta"],why:"Ilma lähtee 30°:lta etelään, ja Coriolis kääntää liikkeen oikealle → koillisesta."},
  {t:"mc",th:"tuulet",lvl:3,q:"Mistä suunnasta eteläisen pallonpuoliskon pasaati puhaltaa?",a:"Kaakosta",w:["Koillisesta","Luoteesta","Lounaasta"],why:"Etelässä Coriolis kääntää vasemmalle: etelästä lähtevä ilma kääntyy kaakkoistuuleksi."},
  {t:"mc",th:"tuulet",lvl:3,q:"Mitkä tuulet puhaltavat navoilta 60° leveydelle?",a:"Polaariset itätuulet",w:["Länsituulet","Pasaatit","Monsuunit"],why:"Navan korkeapaineesta polaaririntaman matalapaineeseen, Coriolis kääntää idästä tuleviksi."},
  {t:"mc",th:"tuulet",lvl:3,q:"Mikä on Hadleyn solu?",a:"Kiertosolu päiväntasaajan (kohoaa) ja 30°:n (laskeutuu) välillä",w:["Kiertosolu 30°–60°","Kiertosolu 60°–90°","Merivirtojen kehä"],why:"Hadley 0–30°, Ferrel 30–60°, polaarisolu 60–90°."},
  {t:"mc",th:"tuulet",lvl:3,q:"Miksi kääntöpiirien korkeapaine tuo kuivuutta?",a:"Laskeva ilma lämpenee, eikä kosteus tiivisty",w:["Siellä ei ole merta","Pasaatit vievät sateet pois","Ilma on siellä liian kylmää"],why:"Sadetta syntyy vain kohoavasta ilmasta. Laskeva ilma kuivuu → Sahara, Arabia, Australia."},
  {t:"mc",th:"tuulet",lvl:3,q:"Miten painevyöhykkeet liikkuvat vuoden aikana?",a:"Ne siirtyvät auringon mukana: kesällä pohjoisemmaksi",w:["Ne pysyvät täsmälleen paikallaan","Ne vaihtavat paikkaa keskenään","Ne katoavat talvella"],why:"Siksi Välimerellä on kesällä kuivaa (30° korkeapaine siirtyy pohjoiseen) ja Sahelissa sadekausi."},
  {t:"order",th:"tuulet",lvl:2,q:"Järjestä painevyöhykkeet päiväntasaajalta pohjoisnavalle.",items:["Päiväntasaajan matalapaine (0°)","Kääntöpiirin korkeapaine (30°)","Polaaririntaman matalapaine (60°)","Navan korkeapaine (90°)"],why:"L – H – L – H. Matala, jossa ilma kohoaa; korkea, jossa se laskeutuu."},
  {t:"order",th:"tuulet",lvl:3,q:"Järjestä tuulen synnyn vaiheet.",items:["Aurinko lämmittää pintaa epätasaisesti","Lämmin ilma kohoaa → matalapaine, kylmä laskeutuu → korkeapaine","Ilma virtaa korkeapaineesta matalapaineeseen","Coriolis kääntää tuulen suuntaa"],why:"Lämpötilaero → paine-ero → tuuli → Coriolis kääntää."},
  {t:"label",th:"tuulet",lvl:1,dg:"tuulet",target:"L0",q:"Klikkaa päiväntasaajan matalapainetta.",why:"0°, jossa lämmin ilma kohoaa."},
  {t:"label",th:"tuulet",lvl:1,dg:"tuulet",target:"H30N",q:"Klikkaa pohjoisen kääntöpiirin korkeapainetta.",why:"30° N, Saharan seutu."},
  {t:"label",th:"tuulet",lvl:1,dg:"tuulet",target:"lansiN",q:"Klikkaa länsituulia pohjoisella pallonpuoliskolla.",why:"30° → 60° N, Suomi kuuluu tähän."},
  {t:"label",th:"tuulet",lvl:2,dg:"tuulet",target:"pasaatiN",q:"Klikkaa koillispasaatia.",why:"30° N → päiväntasaaja."},
  {t:"label",th:"tuulet",lvl:2,dg:"tuulet",target:"L60N",q:"Klikkaa vyöhykettä, jossa syklonit syntyvät.",why:"Polaaririntaman matalapaine 60° N."},
  {t:"label",th:"tuulet",lvl:3,dg:"tuulet",target:"pasaatiS",q:"Klikkaa kaakkoispasaatia.",why:"30° S → päiväntasaaja, kääntyy etelässä vasemmalle."},
  {t:"label",th:"tuulet",lvl:3,dg:"tuulet",target:"itaN",q:"Klikkaa polaarisia itätuulia pohjoisessa.",why:"Navalta 60°:lle."},
  {t:"label",th:"tuulet",lvl:3,dg:"tuulet",target:"H30S",q:"Klikkaa vyöhykettä, jossa Kalaharin ja Australian aavikot ovat.",why:"Eteläinen kääntöpiirin korkeapaine 30° S."},

  // ===== vesi ja sade
  {t:"order",th:"vesi",lvl:1,q:"Järjestä hydrologisen kierron vaiheet haihtumisesta alkaen.",items:["Haihtuminen merestä","Vesihöyry kohoaa ja tiivistyy pilviksi","Sadanta","Pintavalunta ja imeytyminen","Joet ja pohjavesi palauttavat veden mereen"],why:"Haihtuu – tiivistyy – sataa – valuu – palaa mereen. Auringon energia pyörittää."},
  {t:"mc",th:"vesi",lvl:1,q:"Mikä käyttää hydrologista kiertoa?",a:"Auringon energia",w:["Kuun vetovoima","Maan sisäinen lämpö","Tuulivoimalat"],why:"Aurinko haihduttaa veden; painovoima tuo sen takaisin alas."},
  {t:"mc",th:"vesi",lvl:2,q:"Mitä on transpiraatio?",a:"Kasvien haihduttama vesi",w:["Veden imeytyminen maahan","Pilvien muodostuminen","Pohjaveden virtaus"],why:"Haihtuminen + transpiraatio = evapotranspiraatio. Sademetsä tekee osan omista sateistaan."},
  {t:"mc",th:"vesi",lvl:2,q:"Mitä sadevedelle tapahtuu maan pinnalla?",a:"Osa valuu pintavaluntana jokiin, osa imeytyy pohjavedeksi",w:["Kaikki haihtuu heti","Kaikki imeytyy","Kaikki valuu mereen"],why:"Jakosuhde riippuu maalajista, kaltevuudesta ja sateen rankkuudesta."},
  {t:"mc",th:"vesi",lvl:3,q:"Miksi veden määrä maapallolla ei muutu?",a:"Vesi vain kiertää muodosta toiseen: höyry, pisarat, jää, pohjavesi",w:["Meret tekevät uutta vettä","Sade tuo vettä avaruudesta","Vesi häviää haihtuessaan"],why:"Sama vesi on kiertänyt miljardeja vuosia."},
  {t:"label",th:"vesi",lvl:1,dg:"vesi",target:"haihtuminen",q:"Klikkaa haihtumista.",why:"Merestä ylös vesihöyrynä."},
  {t:"label",th:"vesi",lvl:1,dg:"vesi",target:"sadanta",q:"Klikkaa sadantaa.",why:"Pilvestä alas vetenä tai lumena."},
  {t:"label",th:"vesi",lvl:2,dg:"vesi",target:"pohjavesi",q:"Klikkaa pohjavettä.",why:"Maan alla, virtaa hitaasti mereen."},
  {t:"label",th:"vesi",lvl:2,dg:"vesi",target:"tiivistyminen",q:"Klikkaa kohtaa, jossa vesihöyry tiivistyy.",why:"Pilvessä, kun kohoava ilma jäähtyy."},
  {t:"label",th:"vesi",lvl:3,dg:"vesi",target:"imeytyminen",q:"Klikkaa imeytymistä.",why:"Sadevesi imeytyy maaperään pohjavedeksi."},
  {t:"label",th:"vesi",lvl:3,dg:"vesi",target:"transpiraatio",q:"Klikkaa kasvien haihduntaa.",why:"Lehdistä ylös."},
  {t:"mc",th:"vesi",lvl:1,q:"Mikä on yhteistä kaikille sadetyypeille?",a:"Kostea ilma kohoaa, jäähtyy ja vesihöyry tiivistyy",w:["Ilma laskeutuu ja lämpenee","Sataa vain merellä","Tarvitaan vuori"],why:"Sadetyypit eroavat vain siinä, mikä nostaa ilman: vuori, rintama vai kuuma maa."},
  {t:"mc",th:"vesi",lvl:1,q:"Mikä nostaa ilman orografisessa sateessa?",a:"Vuori pakottaa tuulen nousemaan rinnettä",w:["Kylmä ilmamassa","Auringon kuumentama maa","Matalapaineen keskus"],why:"Oro = vuori. Tuulenpuoleinen rinne sateinen, suojan puoli kuiva."},
  {t:"mc",th:"vesi",lvl:1,q:"Mikä nostaa ilman konvektiosateessa?",a:"Auringon kuumentama maa lämmittää ilman, joka kohoaa nopeasti",w:["Vuori","Lämmin ja kylmä ilmamassa kohtaavat","Merivirta"],why:"Konvektio = pystysuora kohoaminen. Syntyy kuuropilvi ja ukkonen."},
  {t:"mc",th:"vesi",lvl:1,q:"Mikä nostaa ilman rintamasateessa?",a:"Lämmin ilma nousee kylmän ilmamassan päälle",w:["Vuori","Kuuma maa","Tuuli mereltä"],why:"Kevyempi lämmin ilma liukuu raskaamman kylmän päälle."},
  {t:"mc",th:"vesi",lvl:2,q:"Mikä on sadevarjo?",a:"Vuoren suojan puoli, jossa laskeva ilma on kuivaa",w:["Pilvi, joka estää sateen","Sateenvarjo","Vuoren tuulenpuoleinen rinne"],why:"Esim. Andien itäpuoli Patagoniassa ja Tiibet Himalajan takana."},
  {t:"mc",th:"vesi",lvl:2,q:"Millainen on rintamasade?",a:"Laaja-alainen, tasainen ja pitkäkestoinen",w:["Rankka, lyhyt ja paikallinen","Vain vuoristossa","Aina ukkosta"],why:"Lämmin ilma nousee loivasti, joten pilvet ovat laajoja ja sade kestää tunteja."},
  {t:"mc",th:"vesi",lvl:2,q:"Millainen on konvektiosade?",a:"Rankka, lyhyt ja paikallinen, usein ukkonen",w:["Laaja ja tasainen","Vain talvella","Tihkusadetta"],why:"Nopea kohoaminen tekee korkean kuuropilven (cumulonimbus)."},
  {t:"mc",th:"vesi",lvl:2,q:"Missä konvektiosade on yleistä?",a:"Tropiikissa lähes päivittäin ja lauhkealla vyöhykkeellä kesällä",w:["Vain navoilla","Vain vuoristossa","Vain talvella"],why:"Tarvitaan kuuma maanpinta: tropiikin iltapäivät, Suomen kesäukkoset."},
  {t:"mc",th:"vesi",lvl:2,q:"Missä rintamasade on yleistä?",a:"Lauhkealla vyöhykkeellä sykloneissa, esim. Suomessa syksyllä ja talvella",w:["Päiväntasaajalla","Saharassa","Vain vuoristossa"],why:"Polaaririntamalla lämmin ja kylmä ilma kohtaavat, ja syklonit tuovat rintamasateet."},
  {t:"mc",th:"vesi",lvl:2,q:"Missä orografinen sade on yleistä?",a:"Vuoristojen tuulenpuoleisilla rinteillä: Norja, Himalaja, Andit",w:["Tasangoilla","Merellä","Aavikoilla"],why:"Tuulen on tultava mereltä ja kohdattava vuori."},
  {t:"mc",th:"vesi",lvl:3,q:"Miksi Norjan länsirannikolla sataa yli 2000 mm vuodessa?",a:"Länsituulet tuovat kosteaa ilmaa Atlantilta ja vuoret nostavat sen: orografinen sade",w:["Se on päiväntasaajalla","Siellä on konvektiosateita joka päivä","Kylmä merivirta viilentää ilman"],why:"Länsituulet + lämmin Pohjois-Atlantin virta + Skandien vuoristo."},
  {t:"sort",th:"vesi",lvl:2,q:"Mikä sadetyyppi?",cats:["Orografinen","Rintamasade","Konvektiosade"],items:[["Suomen kesäinen ukkoskuuro",2],["Tasaista sadetta koko syyspäivän Helsingissä",1],["Sadetta Norjan rannikon vuorten länsirinteillä",0],["Amazonian iltapäiväsade joka päivä",2],["Himalajan etelärinteiden monsuunisateet",0],["Syklonin lämpimän rintaman sade",1],["Kuuropilvi kuuman aavikon reunalla",2],["Lämmin ilma nousee kylmän päälle ja sataa laajalti",1]],why:"Vuori → orografinen. Ilmamassojen raja → rintama. Kuuma maa → konvektio."},
  {t:"mc",th:"vesi",lvl:1,q:"Missä ovat maapallon sateisimmat alueet?",a:"Päiväntasaajan seudulla",w:["Kääntöpiirien seudulla","Navoilla","Mantereiden sisäosissa"],why:"Kuuma kostea ilma kohoaa päivittäin: Amazonia, Kongo, Indonesia."},
  {t:"mc",th:"vesi",lvl:1,q:"Missä ovat maapallon suurimmat aavikot?",a:"Kääntöpiirien seudulla noin 20–30° leveydellä",w:["Päiväntasaajalla","Napapiirillä","Länsituulten vyöhykkeellä"],why:"Subtrooppinen korkeapaine: Sahara, Arabia, Kalahari, Australia."},
  {t:"mc",th:"vesi",lvl:2,q:"Miksi päiväntasaajalla sataa paljon?",a:"Kuuma kostea ilma kohoaa ja tiivistyy: matalapaine ja konvektiosateet",w:["Kylmä ilma laskeutuu siellä","Pasaatit vievät kosteuden sinne mereltä pois","Siellä on paljon vuoria"],why:"Pasaatit tuovat kosteutta, aurinko nostaa ilman, sataa lähes joka päivä."},
  {t:"mc",th:"vesi",lvl:2,q:"Miksi Sahara on kuiva?",a:"Kääntöpiirin korkeapaine: laskeva ilma lämpenee eikä tiivisty",w:["Se on liian kaukana auringosta","Siellä puhaltaa länsituulia","Kylmä merivirta viilentää sitä"],why:"30° N: Hadleyn solun laskeva haara."},
  {t:"mc",th:"vesi",lvl:3,q:"Miksi Atacaman aavikko Chilessä on maailman kuivin?",a:"Kylmä Humboldtin virta viilentää ilman, joka ei kohoa; lisäksi Andit tekevät sadevarjon",w:["Se on kääntöpiirin korkeapaineen ulkopuolella","Siellä on lämmin merivirta","Siellä ei ole tuulia"],why:"Kylmä virta + sadevarjo + korkeapaine: sumuinen mutta lähes sateeton."},
  {t:"mc",th:"vesi",lvl:3,q:"Miksi napa-alueilla sataa vähän?",a:"Kylmä ilma sisältää hyvin vähän kosteutta ja laskeutuu",w:["Siellä ei ole merta","Aurinko haihduttaa kaiken","Pasaatit vievät kosteuden pois"],why:"Etelämanner on kylmä aavikko: alle 200 mm vuodessa."},
  {t:"mc",th:"vesi",lvl:3,q:"Miksi Keski-Aasian sisäosat (Gobi) ovat kuivia?",a:"Kaukana merestä ja vuoristojen sadevarjossa",w:["Ne ovat kääntöpiirillä","Kylmä merivirta","Ne ovat liian korkealla"],why:"Mantereisuus + Himalajan ja Tianshanin sadevarjo."},
  {t:"mc",th:"vesi",lvl:2,q:"Missä on maailman sateisin paikka?",a:"Himalajan juurella Intiassa (monsuunisateet)",w:["Amazonian keskellä","Norjan rannikolla","Indonesiassa"],why:"Mawsynram ja Cherrapunji: kesämonsuuni törmää vuoriin. Yli 11 000 mm vuodessa."},
  {t:"sort",th:"vesi",lvl:1,q:"Sateinen vai kuiva alue?",cats:["Sateinen","Kuiva"],items:[["Amazonia",0],["Sahara",1],["Norjan länsirannikko",0],["Atacama",1],["Kongon allas",0],["Etelämanner",1],["Bangladesh (monsuuni)",0],["Arabian niemimaa",1],["Gobi",1],["Indonesia",0]],why:"Sateiset: päiväntasaaja, monsuuni, vuorten tuulenpuoli. Kuivat: 30°, kylmät virrat, sadevarjot, navat."},
  {t:"mc",th:"vesi",lvl:1,q:"Mikä on tärkein merivirtojen syy?",a:"Vallitsevat tuulet (pasaatit ja länsituulet) työntävät pintavettä",w:["Kuun vetovoima","Jokien virtaus","Tulivuoret merenpohjassa"],why:"Lisäksi Coriolis kääntää virrat kehiksi, mantereet ohjaavat ja tiheyserot ajavat syviä virtoja."},
  {t:"mc",th:"vesi",lvl:2,q:"Mitä lämmin merivirta tekee rannikon ilmastolle?",a:"Lämmittää ja kosteuttaa, lisää sateita",w:["Viilentää ja kuivattaa","Ei vaikuta","Aiheuttaa aavikon"],why:"Golfvirta ja Pohjois-Atlantin virta pitävät Norjan satamat sulina."},
  {t:"mc",th:"vesi",lvl:2,q:"Mitä kylmä merivirta tekee rannikon ilmastolle?",a:"Viilentää; ilma ei kohoa, joten sataa vähän ja on sumua",w:["Lämmittää ja lisää sateita","Tuo ukkosia","Ei vaikuta"],why:"Humboldt → Atacama, Benguela → Namib. Kylmät virrat ovat kuitenkin hyviä kalavesiä."},
  {t:"mc",th:"vesi",lvl:3,q:"Mihin suuntaan merivirtakehät kiertävät pohjoisella pallonpuoliskolla?",a:"Myötäpäivään (Coriolis kääntää oikealle)",w:["Vastapäivään","Suoraan pohjoiseen","Ei säännönmukaisesti"],why:"Etelässä vastapäivään. Kehän länsireunalla lämmin virta pohjoiseen, itäreunalla kylmä virta etelään."},
  {t:"mc",th:"vesi",lvl:3,q:"Miksi Suomessa on leudompaa kuin Grönlannissa samalla leveydellä?",a:"Lämmin Pohjois-Atlantin virta ja länsituulet tuovat lämpöä",w:["Suomi on lähempänä päiväntasaajaa","Suomessa on enemmän metsää","Grönlannissa on korkeampi ilmanpaine"],why:"Golfvirran jatke lämmittää Pohjois-Euroopan ilmaa, jonka länsituulet kuljettavat maalle."},
  {t:"sort",th:"vesi",lvl:2,q:"Lämmin vai kylmä merivirta?",cats:["Lämmin","Kylmä"],items:[["Golfvirta",0],["Humboldtin virta",1],["Benguelan virta",1],["Kuroshio",0],["Pohjois-Atlantin virta",0],["Kanarianvirta",1],["Labradorinvirta",1],["Brasilianvirta",0]],why:"Lämpimät kulkevat päiväntasaajalta napoja kohti, kylmät navoilta päiväntasaajaa kohti."},
  {t:"label",th:"vesi",lvl:1,dg:"sade",target:"orografinen",q:"Klikkaa orografista sadetta.",why:"Vuori nostaa tuulen."},
  {t:"label",th:"vesi",lvl:1,dg:"sade",target:"konvektio",q:"Klikkaa konvektiosadetta.",why:"Kuuma maa, nopea kohoaminen, kuuropilvi."},
  {t:"label",th:"vesi",lvl:2,dg:"sade",target:"rintamasade",q:"Klikkaa sadetyyppiä, joka on yleisin Suomessa syksyllä.",why:"Rintamasade sykloneissa."},
  {t:"label",th:"vesi",lvl:3,dg:"sade",target:"orografinen",q:"Klikkaa sadetyyppiä, johon liittyy sadevarjo.",why:"Orografinen: vuoren suojan puoli on kuiva."},

  // ===== ilmasto
  {t:"mc",th:"ilmasto",lvl:1,q:"Mikä on tärkein ilmastoon vaikuttava tekijä?",a:"Leveysaste: säteilyn tulokulma ja päivän pituus",w:["Maaperän väri","Kaupunkien määrä","Kuun vaiheet"],why:"Leveysaste määrää valaistusvyöhykkeen. Muut tekijät muokkaavat sitä."},
  {t:"mc",th:"ilmasto",lvl:1,q:"Miten korkeus merenpinnasta vaikuttaa lämpötilaan?",a:"Lämpötila laskee noin 6,5 °C kilometriä kohti",w:["Lämpötila nousee ylöspäin","Ei vaikuta","Laskee vain talvella"],why:"Siksi Kilimanjarolla on lunta päiväntasaajan lähellä."},
  {t:"mc",th:"ilmasto",lvl:2,q:"Mitä meren läheisyys tekee ilmastolle?",a:"Tasaa lämpötilaa: viileät kesät, leudot talvet, pieni vuosivaihtelu",w:["Kärjistää: kuumat kesät ja kylmät talvet","Tekee ilmastosta kuivan","Ei vaikuta"],why:"Merellinen ilmasto. Mantereisessa ilmastossa vuosivaihtelu on suuri, koska maa lämpenee ja jäähtyy nopeasti."},
  {t:"mc",th:"ilmasto",lvl:2,q:"Mikä ilmastovyöhyke Suomessa on?",a:"Kylmä eli boreaalinen (lumimetsäilmasto)",w:["Lauhkea merellinen","Polaarinen tundra","Välimeren ilmasto"],why:"Pitkä lumitalvi ja lyhyt lämmin kesä. Vain Lapin tunturit ovat tundraa."},
  {t:"mc",th:"ilmasto",lvl:2,q:"Mikä kuvaa välimeren ilmastoa?",a:"Kuiva kuuma kesä ja sateinen leuto talvi",w:["Sateinen kesä ja kuiva talvi","Sadetta tasaisesti ympäri vuoden","Aina alle 0 °C"],why:"Kesällä 30° korkeapaine siirtyy pohjoiseen, talvella länsituulet tuovat syklonit."},
  {t:"mc",th:"ilmasto",lvl:2,q:"Mikä kuvaa savanni-ilmastoa?",a:"Kuuma ympäri vuoden, sadekausi kesällä ja kuiva kausi talvella",w:["Sadetta joka kuukausi yli 100 mm","Kylmä talvi","Alle 250 mm vuodessa"],why:"Päiväntasaajan matalapaine tuo kesäsateet, kääntöpiirin korkeapaine talven kuivuuden."},
  {t:"mc",th:"ilmasto",lvl:2,q:"Mikä kuvaa sademetsäilmastoa?",a:"Joka kuukausi yli 18 °C ja sadetta paljon ympäri vuoden",w:["Kuiva kausi talvella","Kylmä talvi, kuuma kesä","Sadetta vain kesällä"],why:"Päiväntasaajan seutu: konvektiosateita päivittäin, ei vuodenaikoja."},
  {t:"mc",th:"ilmasto",lvl:3,q:"Milloin ilmasto on kuiva (aavikko tai aro)?",a:"Kun haihdunta on suurempi kuin sadanta",w:["Kun sataa alle 1000 mm","Kun on aina kuuma","Kun on kylmä"],why:"Aavikolla alle 250 mm. Myös kylmä alue voi olla aavikko."},
  {t:"mc",th:"ilmasto",lvl:3,q:"Mikä erottaa tundran ja jäätikköilmaston?",a:"Tundralla lämpimin kuukausi on 0–10 °C, jäätiköllä aina alle 0 °C",w:["Tundralla sataa enemmän","Jäätiköllä kasvaa metsää","Ne ovat sama asia"],why:"Polaarisen vyöhykkeen kaksi tyyppiä."},
  {t:"mc",th:"ilmasto",lvl:3,q:"Miksi lumi viilentää ilmastoa?",a:"Lumi heijastaa säteilyn takaisin (suuri albedo)",w:["Lumi on kylmää","Lumi imee lämmön","Lumi estää tuulen"],why:"Tumma maa ja meri imevät säteilyä, vaalea lumi heijastaa sen."},
  {t:"sort",th:"ilmasto",lvl:2,q:"Merellinen vai mantereinen ilmasto?",cats:["Merellinen","Mantereinen"],items:[["pieni lämpötilan vuosivaihtelu",0],["kuumat kesät ja hyvin kylmät talvet",1],["Bergen, Norja",0],["Jakutsk, Siperia",1],["sadetta tasaisesti ympäri vuoden",0],["vähän sadetta, kaukana merestä",1],["leudot talvet",0],["suuri lämpötilan vuosivaihtelu",1]],why:"Meri tasaa, manner kärjistää."},
  {t:"order",th:"ilmasto",lvl:2,q:"Järjestä ilmastovyöhykkeet päiväntasaajalta navalle.",items:["Kuuma (trooppinen)","Kuiva (aavikko, 30°)","Lauhkea","Kylmä (boreaalinen)","Polaarinen (tundra, jäätikkö)"],why:"Vyöhykkeet seuraavat leveysastetta, mutta meri, virrat ja vuoret muokkaavat rajoja."},
  // syklonit
  {t:"mc",th:"ilmasto",lvl:1,q:"Missä syklonit syntyvät?",a:"Polaaririntamalla (n. 60°), jossa lämmin ja kylmä ilma kohtaavat",w:["Päiväntasaajalla","Kääntöpiirin korkeapaineessa","Navoilla"],why:"Lämmin trooppinen ja kylmä polaarinen ilma kohtaavat ja rintamaan syntyy aalto."},
  {t:"mc",th:"ilmasto",lvl:1,q:"Mihin suuntaan sykloni liikkuu Suomen kohdalla?",a:"Länneltä itään länsituulten mukana",w:["Idästä länteen","Etelästä pohjoiseen","Se ei liiku"],why:"Siksi sää tulee Suomeen yleensä lännestä."},
  {t:"mc",th:"ilmasto",lvl:2,q:"Miten ilma kiertää syklonin keskusta pohjoisella pallonpuoliskolla?",a:"Vastapäivään ja sisäänpäin",w:["Myötäpäivään ja ulospäin","Suoraan keskustaan","Suoraan ylös"],why:"Coriolis kääntää sisään virtaavan ilman oikealle → vastapäivään. Korkeapaineessa päinvastoin."},
  {t:"mc",th:"ilmasto",lvl:2,q:"Kumpi rintama on syklonin edessä (idässä)?",a:"Lämmin rintama",w:["Kylmä rintama","Okluusiorintama","Ei kumpikaan"],why:"Lämmin rintama edellä, kylmä rintama perässä, lämmin sektori välissä."},
  {t:"mc",th:"ilmasto",lvl:2,q:"Millainen sää on lämpimän rintaman edellä?",a:"Pilvet paksuuntuvat vähitellen ja seuraa pitkä tasainen sade",w:["Kuuroja ja ukkosta","Kirkasta ja kylmää","Tyyntä ja aurinkoista"],why:"Lämmin ilma liukuu loivasti kylmän päälle: ensin cirrus, sitten nimbostratus."},
  {t:"mc",th:"ilmasto",lvl:2,q:"Millainen sää on kylmän rintaman kohdalla?",a:"Kuurosateita, ukkosta, tuuli kääntyy ja voimistuu, sitten kirkastuu ja viilenee",w:["Pitkä tasainen sade","Lämpenee ja tyyntyy","Ei muutosta"],why:"Kylmä ilma työntyy jyrkästi lämpimän alle ja nostaa sen nopeasti."},
  {t:"mc",th:"ilmasto",lvl:3,q:"Mitä on okluusio?",a:"Kylmä rintama saa lämpimän rintaman kiinni ja lämmin ilma nostetaan kokonaan ylös",w:["Syklonin syntyminen","Lämmin sektori laajenee","Sykloni kääntyy takaisin länteen"],why:"Kylmä rintama liikkuu nopeammin. Okluusion jälkeen sykloni täyttyy ja hajoaa."},
  {t:"mc",th:"ilmasto",lvl:3,q:"Miten lämmin rintama merkitään säkarttaan?",a:"Punainen viiva, jossa puoliympyrät liikesuuntaan",w:["Sininen viiva, jossa kolmiot","Violetti viiva","Vihreä katkoviiva"],why:"Kylmä rintama on sininen ja kolmiot. Okluusio on violetti, jossa molemmat merkit."},
  {t:"order",th:"ilmasto",lvl:1,q:"Järjestä syklonin vaiheet.",items:["Rintama: ilmamassat liikkuvat vastakkain","Aalto: lämmin ilma työntyy kylmään, paine laskee","Kypsä sykloni: lämmin ja kylmä rintama, lämmin sektori","Okluusio: kylmä rintama saa lämpimän kiinni","Sykloni täyttyy ja hajoaa"],why:"Rintama – aalto – kypsä – okluusio – hajoaminen. Koko elinkaari kestää muutaman päivän."},

  stage.innerHTML=`<h2>Tutki kaavioita</h2><p>Valitse teema ja klikkaa kaavion kohteita. Kysymysten vastaukset ovat kaavion alla.</p>${tabs}${dgTabs}${ctrl}<div class="diagram" id="dg">${drawDiagram(ex.dg,ex.item)}</div>${itemBtns}<div class="explain" id="explain"></div><h3 style="margin-top:14px">${th.name}: kysymykset ${th.qs.join(", ")}</h3>${cardsHtml}`;

function itemKnown(id){const ks=bank.filter(q=>q.t==="label"&&q.target===id).map(q=>q.key);return ks.length>0&&ks.every(k=>known.has(k));}
function selectItem(id){ex.item=id;ex.phase=null;document.getElementById("dg").innerHTML=drawDiagram(ex.dg,id);stage.querySelectorAll(".items [data-item]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.item===id));renderExplain();const el=document.getElementById("dg").querySelector(`.hit[data-item="${id}"]`);if(el)el.classList.add("pulse");}
function renderExplain(){
  const el=document.getElementById("explain");if(!el)return;
  if(ex.phase){el.innerHTML=`<p>${phaseInfo[ex.phase]}</p>`;speak(phaseInfo[ex.phase]);return;}
  if(ex.dg==="diagrammi"){const st=stations[ex.st];let m="";
    if(ex.item&&ex.item[0]==="m"&&!items[ex.item]){const i=+ex.item.slice(1);m=`<p><b>${MONF[i].charAt(0).toUpperCase()+MONF[i].slice(1)}:</b> keskilämpötila ${String(st.t[i]).replace(".",",")} °C, sademäärä ${st.p[i]} mm. ${st.p[i]<2*st.t[i]?"Pylväs jää käyrän alle → kuiva kuukausi.":"Pylväs ylittää käyrän → kostea kuukausi."}</p>`;}
    else if(items[ex.item]){const it=items[ex.item];m=`<h3>${it.name}${listenBtn(it.name+". "+it.why)}</h3><p class="where">${it.where}</p><p>${it.why}</p>`;}
    const mean=(st.t.reduce((a,b)=>a+b,0)/12).toFixed(1).replace(".",",");const sum=st.p.reduce((a,b)=>a+b,0);const amp=(Math.max(...st.t)-Math.min(...st.t)).toFixed(1).replace(".",",");const wi=st.t.indexOf(Math.max(...st.t));const dryM=st.t.map((t,i)=>st.p[i]<2*t?MONF[i].slice(0,3):null).filter(Boolean);
    el.innerHTML=m+`<h4>${st.name} (${st.lat}, ${st.alt})</h4><div class="kv"><b>Pallonpuolisko</b><span>${st.hemi==="N"?"pohjoinen":"eteläinen"} (lämpimin kuukausi ${MONF[wi]})</span><b>Vuoden keskilämpötila</b><span>${mean} °C</span><b>Vuosivaihtelu</b><span>${amp} °C (${+amp.replace(",",".")>30?"suuri: mantereinen":+amp.replace(",",".")<15?"pieni: merellinen tai trooppinen":"kohtalainen"})</span><b>Vuosisademäärä</b><span>${sum} mm</span><b>Kuiva kausi</b><span>${dryM.length===0?"ei ole":dryM.length>=11?"koko vuosi":dryM.join(", ")}</span><b>Ilmastotyyppi</b><span>${st.type}</span></div><p>${st.why}</p>${ex.upto<12?`<p class="tip">Piirretty ${ex.upto} kuukautta. Lämpötila merkitään pisteenä vasemman akselin mukaan, sade pylväänä oikean akselin mukaan (1 °C = 2 mm).</p>`:""}<table class="tbl"><tr><th></th>${MON.map(m=>`<th>${m}</th>`).join("")}</tr><tr><td>°C</td>${st.t.map(t=>`<td>${String(t).replace(".",",")}</td>`).join("")}</tr><tr><td>mm</td>${st.p.map(p=>`<td>${p}</td>`).join("")}</tr></table>`;
    return;}
  const it=items[ex.item];
  if(!it){el.innerHTML=`<p class="muted">Klikkaa kaavion kohdetta tai nimeä, niin näet mitä se on, missä se on ja miksi sillä on väliä.</p>`;return;}
  el.innerHTML=`<h3>${it.name}${listenBtn(it.name+". "+it.where+". "+it.why)}</h3><p class="where">${it.where}</p><span class="group">${it.group}</span><p>${it.why}</p>`;
  speak(it.name+". "+it.why);
}

    <label><input type="checkbox" id="s-big"${support.big?" checked":""}>Isompi teksti</label>
    <label><input type="checkbox" id="s-speak"${support.speak?" checked":""}>Lue kysymykset ja selitykset ääneen</label>
    <label><input type="checkbox" id="s-known"${support.showKnown?" checked":""}>Näytä kolmesti osatut kohteet vihreinä Tutki-tilassa</label>
    <label>Session pituus<select id="s-min">${[3,5,10,15].map(m=>`<option value="${m}"${support.minutes===m?" selected":""}>${m} min</option>`).join("")}</select></label>
  </details>`;
  stage.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>startFlow(b.dataset.level));
  document.getElementById("th-sel").onchange=e=>{flow.theme=e.target.value;};
  document.getElementById("s-calm").onchange=e=>support.calm=e.target.checked;
  document.getElementById("s-big").onchange=e=>{support.big=e.target.checked;document.body.classList.toggle("big",support.big);};
  document.getElementById("s-speak").onchange=e=>support.speak=e.target.checked;
  document.getElementById("s-known").onchange=e=>support.showKnown=e.target.checked;
  document.getElementById("s-min").onchange=e=>{support.minutes=+e.target.value;chooseLevel();};
}
// ilmastodiagrammikysymykset generoidaan asemista
function climateQs(max){
  const qs=[];
  stations.forEach(st=>{
    const wi=st.t.indexOf(Math.max(...st.t)),ci=st.t.indexOf(Math.min(...st.t));
    const dry=st.t.map((t,i)=>st.p[i]<2*t);const nd=dry.filter(Boolean).length;
    qs.push({t:"clim",sub:"hemi",lvl:1,st,q:"Kummalla pallonpuoliskolla tämä asema on?",a:st.hemi==="N"?"Pohjoisella":"Eteläisellä",w:[st.hemi==="N"?"Eteläisellä":"Pohjoisella"],why:`Lämpimin kuukausi on ${MONF[wi]}, joten kesä on ${st.hemi==="N"?"kesä–elokuussa: pohjoinen":"joulu–helmikuussa: eteläinen"} pallonpuolisko.`});
    qs.push({t:"clim",sub:"month",lvl:1,st,q:"Klikkaa lämpimintä kuukautta.",month:i=>st.t[i]===st.t[wi],why:`Lämpimin on ${MONF[wi]}, ${String(st.t[wi]).replace(".",",")} °C. Lue punaisen käyrän huippu.`});
    const pm=Math.max(...st.p),pmin=Math.min(...st.p);
    qs.push({t:"clim",sub:"month",lvl:1,st,q:"Klikkaa sateisinta kuukautta.",month:i=>st.p[i]===pm,why:`Korkein pylväs: ${MONF[st.p.indexOf(pm)]}, ${pm} mm.`});
    if(pm!==pmin)qs.push({t:"clim",sub:"month",lvl:2,st,q:"Klikkaa kuivinta kuukautta.",month:i=>st.p[i]===pmin,why:`Matalin pylväs: ${MONF[st.p.indexOf(pmin)]}, ${pmin} mm.`});
    let dryA,dryW;
    if(nd===0){dryA="Ei kuivaa kautta";dryW="Sadepylväät ylittävät lämpökäyrän joka kuukausi.";}
    else if(nd>=11){dryA="Lähes koko vuosi on kuiva";dryW="Pylväät jäävät käyrän alle lähes joka kuukausi: aavikko.";}
    else{const summer=st.hemi==="N"?[4,5,6,7,8]:[10,11,0,1,2];const ds=dry.map((d,i)=>d&&summer.includes(i)).filter(Boolean).length;dryA=ds>nd/2?"Kuiva kausi on kesällä":"Kuiva kausi on talvella";dryW=`Pylväät jäävät käyrän alle kuukausina ${dry.map((d,i)=>d?MONF[i].slice(0,3):null).filter(Boolean).join(", ")}.`;}
    qs.push({t:"clim",sub:"dry",lvl:2,st,q:"Milloin tällä asemalla on kuiva kausi?",a:dryA,w:["Ei kuivaa kautta","Kuiva kausi on kesällä","Kuiva kausi on talvella","Lähes koko vuosi on kuiva"].filter(x=>x!==dryA),why:dryW+" Kuiva kausi = pylväs jää lämpökäyrän alle (1 °C = 2 mm)."});
    qs.push({t:"clim",sub:"type",lvl:2,st,q:"Mikä ilmastotyyppi tämä on?",a:st.type,w:shuffle(climTypes.filter(x=>x!==st.type)).slice(0,3),why:st.why});
    const amp=Math.max(...st.t)-Math.min(...st.t);
    if(amp>30||amp<15&&!["singapore","lima","kairo","mumbai","bamako"].includes(st.id))qs.push({t:"clim",sub:"cont",lvl:2,st,q:"Onko ilmasto merellinen vai mantereinen?",a:amp>30?"Mantereinen":"Merellinen",w:[amp>30?"Merellinen":"Mantereinen"],why:`Vuosivaihtelu on ${amp.toFixed(0)} °C: ${amp>30?"suuri, eli kaukana meren tasaavasta vaikutuksesta":"pieni, eli meri tasaa lämpötilaa"}.`});
  });
  return shuffle(qs).slice(0,max);
}
function buildQueue(){
  const L=cfg();
  let qs=bank.filter(q=>q.lvl<=L.max&&(flow.theme==="all"||q.th===flow.theme));
  if(L.max>=2&&(flow.theme==="all"||flow.theme==="ilmasto"))qs=qs.concat(climateQs(flow.theme==="all"?10:14).filter(q=>q.lvl<=L.max).map(q=>Object.assign({th:"ilmasto",key:"c:"+q.st.id+":"+q.sub+":"+q.q},q)));
  else if(L.max===1&&(flow.theme==="all"||flow.theme==="ilmasto"))qs=qs.concat(climateQs(flow.theme==="all"?5:8).filter(q=>q.lvl===1).map(q=>Object.assign({th:"ilmasto",key:"c:"+q.st.id+":"+q.sub+":"+q.q},q)));
  // vähemmän tunnettuja ensin, osatut harvemmin
  const fresh=qs.filter(q=>!known.has(q.key)),old=qs.filter(q=>known.has(q.key));
  return shuffle(fresh).concat(shuffle(old));
}
function startFlow(level){
  flow.level=level;flow.queue=buildQueue();flow.asked=0;flow.right=0;flow.streak=0;flow.best=0;flow.missed=new Map();flow.busy=false;flow.done=false;flow.q=null;flow.count=0;
  flow.timed=flow.theme==="all";flow.limit=flow.timed?support.minutes*60:15;flow.left=flow.limit;
  if(flow.timer)clearInterval(flow.timer);
  if(flow.timed)flow.timer=setInterval(()=>{flow.left--;const b=stage.querySelector(".time i");if(b)b.style.width=(flow.left/flow.limit*100)+"%";const tl=stage.querySelector(".tl");if(tl)tl.textContent=fmt(flow.left);if(flow.left<=0)endFlow();},1000);
  nextFlow();
}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function flowHeader(){
  const L=cfg();const th=flow.theme==="all"?"kaikki teemat":themes.find(t=>t.id===flow.theme).short;
  const nums=support.calm?"":`<span>oikein <b>${flow.right}/${flow.asked}</b></span><span class="streak">putki ${flow.streak}</span>`;
  const prog=flow.timed?`<div class="time"><i style="width:${flow.left/flow.limit*100}%"></i></div><span class="tl">${fmt(flow.left)}</span>`:`<span>kysymys ${Math.min(flow.count,flow.limit)}/${flow.limit}</span>`;
  return `<div class="flowbar"><span>${L.name.split(":")[0]} · ${th}</span>${prog}${nums}<button id="stop" style="border:none;background:none;color:#5b6b78;cursor:pointer;font:inherit;font-size:13px">Lopeta</button></div>`;
}
function nextFlow(){
  if(flow.done)return;if(flow.adv){clearTimeout(flow.adv);flow.adv=null}flow.busy=false;oq=null;
  if(!flow.timed&&flow.count>=flow.limit){endFlow();return;}
  if(!flow.queue.length){flow.queue=buildQueue();if(!flow.queue.length){endFlow();return;}}
  const q=flow.queue.shift();flow.q=q;flow.count++;
  renderQuestion(q);
}
function renderQuestion(q){
  const L=cfg();let body="";
  if(q.t==="mc"||(q.t==="clim"&&q.sub!=="month")){
    let w=shuffle(q.w).slice(0,L.opts-1);const opts=shuffle([q.a,...w]);
    const dg=q.t==="clim"?`<div class="diagram">${DG.diagrammi(null,{station:q.st,hideTitle:true})}</div>`:q.st?`<div class="diagram">${DG.diagrammi(null,{station:stations.find(s=>s.id===q.st)})}</div>`:"";
    body=`<p class="quiz-q">${q.q}${listenBtn(q.q)}</p>${dg}<div class="opts">${opts.map(o=>`<button data-ans="${o.replace(/"/g,"&quot;")}">${o}</button>`).join("")}</div>`;
  }else if(q.t==="clim"&&q.sub==="month"){
    body=`<p class="quiz-q">${q.q}${listenBtn(q.q)}</p><div class="diagram" id="qdg">${DG.diagrammi(null,{station:q.st,hideTitle:true})}</div><p class="muted" style="font-size:13px">Klikkaa kuukauden saraketta.</p>`;
  }else if(q.t==="sort"){
    const used=q._used||(q._used=new Set());let avail=q.items.map((x,i)=>i).filter(i=>!used.has(i));if(!avail.length){used.clear();avail=q.items.map((x,i)=>i);}
    const i=pick(avail);used.add(i);q._cur=i;
    body=`<p class="quiz-q">${q.q}${listenBtn(q.q+" "+q.items[i][0])}</p><p style="font-size:20px;font-weight:600;margin:4px 0 10px">${q.items[i][0]}</p><div class="opts${q.cats.length===2?" two":""}">${q.cats.map((c,k)=>`<button class="big" data-cat="${k}">${c}</button>`).join("")}</div>`;
  }else if(q.t==="order"){
    oq={items:shuffle(q.items.map((t,i)=>({t,i}))),placed:[]};
    body=`<p class="quiz-q">${q.q}${listenBtn(q.q)}</p><div id="order-area">${orderHTML(q)}</div>`;
  }else if(q.t==="label"){
    const hint=L.hint&&!L.labels&&items[q.target]?`<p class="muted" style="font-size:13.5px">Vihje: ${items[q.target].where}</p>`:"";
    const dg=q.dg==="sykloni"?DG.sykloni(null,{labels:L.labels,step:5}):DG[q.dg](null,{labels:L.labels});
    body=`<p class="quiz-q">${q.q}${listenBtn(q.q)}</p>${hint}<div class="diagram" id="qdg">${dg}</div><p class="muted" id="miss-tip" style="font-size:13px">&nbsp;</p>`;
  }
  stage.innerHTML=flowHeader()+body;
  document.getElementById("stop").onclick=endFlow;
  speak(q.q);
  stage.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>flowAnswer({ans:b.dataset.ans,btn:b}));
  stage.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>flowAnswer({cat:+b.dataset.cat,btn:b}));
  const qdg=document.getElementById("qdg");
  if(qdg){qdg.onclick=e=>{const h=e.target.closest(".hit");if(!h){const t=document.getElementById("miss-tip");if(t)t.textContent="Klikkaa kaavion kohdetta.";return;}if(h.dataset.month!==undefined)flowAnswer({month:+h.dataset.month});else if(h.dataset.item)flowAnswer({item:h.dataset.item});};
    qdg.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){const h=e.target.closest(".hit");if(h){e.preventDefault();h.click();}}};}
  bindOrder();
  const f=stage.querySelector(".opts button, .bank button");if(f&&!("ontouchstart" in window))f.focus();
}
function orderHTML(q){
  const slots=q.items.map((_,k)=>{const p=oq.placed[k];return `<div class="slot${p?" filled":""}" data-slot="${k}"><b>${k+1}.</b>${p?p.t:'<span class="muted">…</span>'}</div>`;}).join("");
  const bankH=oq.items.filter(it=>!oq.placed.includes(it)).map(it=>`<button data-o="${it.i}">${it.t}</button>`).join("");
  return `<div class="order">${slots}</div><div class="bank" aria-label="Vaihtoehdot">${bankH}</div><div class="row"><button id="undo" ${oq.placed.length?"":"disabled"}>Peru</button></div>`;
}
function bindOrder(){
  const a=document.getElementById("order-area");if(!a)return;
  a.onclick=e=>{if(!oq||flow.busy)return;const b=e.target.closest("button,.slot.filled");if(!b)return;
    if(b.dataset.o!==undefined){const it=oq.items.find(x=>x.i===+b.dataset.o);oq.placed.push(it);const left=oq.items.filter(x=>!oq.placed.includes(x));if(left.length===1)oq.placed.push(left[0]);
      a.innerHTML=orderHTML(flow.q);if(oq.placed.length===flow.q.items.length)flowAnswer({order:oq.placed.map(x=>x.i)});else{const nb=a.querySelector(".bank button");if(nb&&!("ontouchstart" in window))nb.focus();}}
    else if(b.dataset.slot!==undefined){oq.placed.splice(+b.dataset.slot);a.innerHTML=orderHTML(flow.q);}
    else if(b.id==="undo"){oq.placed.pop();a.innerHTML=orderHTML(flow.q);}
  };
}
function flowAnswer(a){
  if(flow.busy||!flow.q||flow.done)return;
  const q=flow.q;let ok=false,what="";
  if(q.t==="mc"||(q.t==="clim"&&q.sub!=="month")){ok=a.ans===q.a;what=ok?`<strong>${q.a}</strong>`:`Ei. Oikea: <strong>${q.a}</strong>`;
    stage.querySelectorAll("[data-ans]").forEach(b=>{b.disabled=true;if(b.dataset.ans===q.a)b.classList.add("right");else if(b===a.btn)b.classList.add("wrong");});}
  else if(q.t==="clim"&&q.sub==="month"){ok=q.month(a.month);what=ok?`<strong>${MONF[a.month]}</strong>`:`Ei, ${MONF[a.month]} ei ole se. `;
    const svg=document.getElementById("qdg");svg.querySelectorAll(".hit[data-month]").forEach(h=>{const m=+h.dataset.month;if(q.month(m))h.classList.add("hl");});}
  else if(q.t==="sort"){const it=q.items[q._cur];ok=a.cat===it[1];what=ok?`<strong>${it[0]}</strong>: ${q.cats[it[1]]}`:`Ei. <strong>${it[0]}</strong>: ${q.cats[it[1]]}`;
    stage.querySelectorAll("[data-cat]").forEach(b=>{b.disabled=true;if(+b.dataset.cat===it[1])b.classList.add("right");else if(b===a.btn)b.classList.add("wrong");});}
  else if(q.t==="order"){ok=a.order.every((v,i)=>v===i);const firstWrong=a.order.findIndex((v,i)=>v!==i);
    what=ok?"<strong>Oikea järjestys.</strong>":`Ei ihan. Kohta ${firstWrong+1} pitäisi olla: <strong>${q.items[firstWrong]}</strong>.<br><span class="muted">Oikea järjestys: ${q.items.map((t,i)=>`${i+1}. ${t}`).join(" · ")}</span>`;}
  else if(q.t==="label"){const within={otsoni:"strato",paivantasaaja:"tropiikki"};ok=a.item===q.target||within[a.item]===q.target;const name=items[a.item]?items[a.item].name:phaseNames[a.item]||a.item;const tname=items[q.target]?items[q.target].name:phaseNames[q.target]||q.target;
    what=ok?`<strong>${tname}</strong>`:`Ei, se on ${name}. Oikea: <strong>${tname}</strong>`;
    const svg=document.getElementById("qdg");if(svg){const t=svg.querySelector(`.hit[data-item="${q.target}"]`);if(t){t.classList.add("hl","pulse");t.querySelectorAll(".lbl").forEach(l=>l.classList.remove("hidden"));}if(!ok){const w=svg.querySelector(`.hit[data-item="${a.item}"]`);if(w)w.querySelectorAll(".lbl").forEach(l=>l.classList.remove("hidden"));}}}
  else return;
  flow.busy=true;flow.asked++;markKnown(q.key,ok);
  let cheer="";
  if(ok){flow.right++;flow.streak++;flow.best=Math.max(flow.best,flow.streak);cheer=cheers.streak[flow.streak]?`<p class="cheer big">${cheers.streak[flow.streak]}</p>`:`<p class="cheer">${pick(cheers.ok)}</p>`;}
  else{flow.streak=0;flow.missed.set(q.key,{n:(flow.missed.get(q.key)||{n:0}).n+1,q});
    const pos=support.calm?0:Math.min(flow.queue.length,3+Math.floor(Math.random()*3));flow.queue.splice(pos,0,q);cheer=`<p class="cheer">${pick(cheers.no)}</p>`;}
  const why=q.why?`<p class="tip">${q.why}</p>`:"";
  const fb=document.createElement("div");fb.innerHTML=`<div class="feedback ${ok?"ok":"no"}">${what}${listenBtn(strip(what)+". "+(q.why||""))}</div>${why}${cheer}<div class="row"><button id="next" class="primary">Seuraava</button></div>`;
  stage.appendChild(fb);
  const hb=stage.querySelector(".flowbar");if(hb)hb.outerHTML=flowHeader();document.getElementById("stop").onclick=endFlow;
  speak(strip(what)+". "+(q.why||""));
  const nb=document.getElementById("next");nb.onclick=nextFlow;nb.focus({preventScroll:false});nb.scrollIntoView({block:"nearest"});
  if(!support.calm)flow.adv=setTimeout(()=>{flow.adv=null;if(flow.q===q&&flow.busy)nextFlow()},ok?1600:(q.t==="order"?5000:3500));
}
function endFlow(){
  flow.done=true;if(flow.timer){clearInterval(flow.timer);flow.timer=null}if(flow.adv){clearTimeout(flow.adv);flow.adv=null}oq=null;
  const acc=flow.asked?Math.round(flow.right/flow.asked*100):0;
  const miss=[...flow.missed.values()].sort((a,b)=>b.n-a.n).slice(0,support.calm?2:4).map(({q})=>{const th=themes.find(t=>t.id===q.th);return `<li><strong>${q.q}</strong> <span class="muted">(${th?th.short:""})</span><br>${q.a?`→ ${q.a}. `:""}${q.why||""}</li>`;}).join("");
  const byTheme=new Map();[...streaks.entries()].forEach(([k,n])=>{const q=bank.find(x=>x.key===k);if(q&&n>=2)byTheme.set(q.th,(byTheme.get(q.th)||0)+1);});
  const bestTh=[...byTheme.entries()].sort((a,b)=>b[1]-a[1])[0];
  const good=bestTh?`<p><strong>Meni hyvin:</strong> ${themes.find(t=>t.id===bestTh[0]).name.toLowerCase()}.</p>`:"";
  const line=acc>=90?"Erinomainen sessio. Seuraava kerta voi olla lyhyempi – tämä on hallussa.":acc>=70?"Vahva sessio. Alla olevat kannattaa katsoa vielä kerran huomenna.":"Hyvä alku. Toinen sessio huomenna tekee tästä pysyvää.";
  stage.innerHTML=`<h2>Sessio tehty</h2><div class="stats"><span>kysymyksiä <b>${flow.asked}</b></span><span>oikein <b>${acc} %</b></span><span class="streak">paras putki <b>${flow.best}</b></span></div><p class="cheer">${line}</p>${good}${miss?`<p><strong>Seuraavaksi:</strong></p><ul class="review">${miss}</ul>`:"<p>Ei yhtään virhettä, jota tarvitsisi kerrata.</p>"}<div class="row"><button id="again" class="primary">Uusi sessio (${cfg().name.split(":")[0]})</button><button id="lvl">Vaihda tasoa tai teemaa</button><button id="explore">Tutki kaavioita</button></div>`;
  document.getElementById("again").onclick=()=>startFlow(flow.level);document.getElementById("lvl").onclick=chooseLevel;document.getElementById("explore").onclick=()=>setMode("explore");
  window.scrollTo({top:0});
}
stage.addEventListener("click",e=>{const b=e.target.closest(".listen");if(b)speak(b.dataset.say,true);});
setMode("explore");
</script>
