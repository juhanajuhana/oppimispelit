<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maapallo ja ilmakehä – GE1-kertaus</title>
<style>
  :root{
    --ink:#1c2a36; --muted:#5b6b78; --page:#f7f9fb; --panel:#ffffff; --line:#e1e7ec; --accent:#1f6f8b; --focus:#f2b134;
    --warm:#d1452b; --warm-bg:#fbe6e2; --cold:#2757a8; --cold-bg:#e3ebf7; --ok:#2e8b57; --ok-bg:#e4f3e6; --sun:#f2b134; --land:#e6d9b8; --sea:#cfe3ef;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.45}
  body.big{font-size:18px}
  body.big .stage p,body.big .opts button,body.big .row button{font-size:17px}
  header{max-width:860px;margin:0 auto;padding:18px 22px 4px}
  h1{font-size:26px;margin:0;font-weight:600;letter-spacing:-.01em}
  header p{margin:2px 0 0;color:var(--muted);font-size:15px}
  nav{display:flex;gap:6px;padding:10px 22px 12px;flex-wrap:wrap;max-width:860px;margin:0 auto}
  nav button{border:1px solid #d4dbe1;background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
  nav button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  nav button.flow-btn{border-color:var(--accent);color:var(--accent)}
  nav button.flow-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  nav button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  main{max-width:860px;margin:0 auto;padding:0 22px 40px}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-height:260px}
  .stage h2{margin:0 0 6px;font-size:20px;font-weight:600}
  .stage h3{margin:0 0 4px;font-size:17px;font-weight:600}
  .stage h4{margin:10px 0 4px;font-size:15px;font-weight:600}
  .stage p{margin:0 0 10px;font-size:14.5px}
  .stage ul,.stage ol{margin:0 0 10px;padding-left:20px;font-size:14.5px}
  .stage li{margin-bottom:3px}
  .muted{color:var(--muted)}
  .quiz-q{font-size:18px;font-weight:600;margin:6px 0 10px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .tabs button{border:1px solid #d4dbe1;background:#fff;color:var(--ink);padding:6px 11px;border-radius:999px;font:inherit;font-size:13.5px;cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tabs button:focus-visible{outline:3px solid var(--focus)}
  .tabs button .n{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#e9eef2;color:var(--ink);font-size:11.5px;text-align:center;margin-right:5px;font-weight:600}
  .tabs button[aria-pressed="true"] .n{background:#fff;color:var(--accent)}
  .diagram{margin:6px 0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .diagram svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#fff}
  .diagram svg text{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;pointer-events:none}
  .hit{cursor:pointer}
  .hit:hover .zone,.hit:focus .zone{filter:brightness(.93)}
  .hl .zone{stroke:#f2b134;stroke-width:3px}
  .hl text,.hl .lbl{font-weight:700}
  .lbl.hidden{display:none}
  .pulse{animation:pulse 1.2s ease-in-out 2}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .items{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .items button{border:1px solid #d4dbe1;background:#fff;color:var(--ink);padding:6px 10px;border-radius:6px;font:inherit;font-size:13.5px;cursor:pointer}
  .items button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#eef6f9}
  .items button.known{border-color:var(--ok);background:var(--ok-bg)}
  .items button:focus-visible{outline:3px solid var(--focus)}
  .explain{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
  .explain .where{color:var(--muted);font-size:13.5px;margin-bottom:6px}
  .explain .group{display:inline-block;background:#eef1f4;border-radius:4px;padding:1px 7px;font-size:12.5px;margin-bottom:6px;margin-right:6px}
  .card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;background:#fbfcfd}
  .card summary{cursor:pointer;font-weight:600;font-size:15px}
  .card summary .q{color:var(--accent);margin-right:6px}
  .card .body{margin-top:8px}
  .card .body p,.card .body li{font-size:14.5px}
  .card .key{background:#fff8e6;border-left:3px solid var(--sun);padding:6px 10px;border-radius:0 6px 6px 0;margin:6px 0}
  .feedback{padding:10px 12px;border-radius:6px;font-size:14.5px;margin-top:10px}
  .feedback.ok{background:var(--ok-bg);color:#1f5e2b} .feedback.no{background:var(--warm-bg);color:#8a2a1a}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .row button,.opts button{border:1px solid #d4dbe1;background:#fff;color:var(--ink);padding:9px 14px;border-radius:6px;font:inherit;font-size:15px;cursor:pointer;text-align:left}
  .row button:hover,.opts button:hover{border-color:var(--accent)}
  .row button:focus-visible,.opts button:focus-visible{outline:3px solid var(--focus)}
  .row button small,.opts button small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
  .row button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .opts{display:grid;gap:8px;margin-top:8px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts button.big{font-size:17px;padding:12px 14px}
  .opts button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .opts button.right{border-color:var(--ok);background:var(--ok-bg)}
  .opts button.wrong{border-color:var(--warm);background:var(--warm-bg)}
  .opts button:disabled{cursor:default;opacity:.85}
  .order{display:grid;gap:6px;margin:6px 0 10px}
  .order .slot{display:flex;gap:8px;align-items:center;border:1px dashed #c7d0d8;border-radius:6px;padding:7px 10px;min-height:38px;font-size:14.5px}
  .order .slot b{color:var(--muted);font-weight:600;min-width:18px}
  .order .slot.filled{border-style:solid;background:#f3f7f9;cursor:pointer}
  .bank{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
  .bank button{border:1px solid #d4dbe1;background:#fff;border-radius:6px;padding:7px 11px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink)}
  .bank button:focus-visible{outline:3px solid var(--focus)}
  .tip{background:#fff8e6;border-left:3px solid var(--sun);padding:6px 10px;border-radius:0 6px 6px 0;font-size:14px;margin:8px 0}
  .cheer{color:var(--accent);font-weight:600;font-size:15px;margin:6px 0}
  .cheer.big{font-size:19px}
  .flowbar{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
  .flowbar .time{flex:1;min-width:120px;height:8px;background:#e9eef2;border-radius:4px;overflow:hidden}
  .flowbar .time i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
  .flowbar .streak{font-weight:600;color:var(--ink)}
  .stats{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 12px;font-size:14.5px}
  .stats b{font-size:20px;display:block}
  .review li{margin-bottom:6px}
  details.support{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  details.support summary{cursor:pointer;color:var(--muted);font-size:14px}
  details.support label{display:block;margin:8px 0;font-size:14.5px}
  details.support input[type=checkbox]{margin-right:8px;transform:scale(1.15)}
  details.support select{font:inherit;padding:4px 6px;margin-left:8px}
  details.rules{margin-top:12px;font-size:14px}
  details.rules summary{cursor:pointer;color:var(--muted)}
  .listen{border:none;background:none;color:var(--accent);cursor:pointer;font:inherit;font-size:13.5px;padding:0 4px;vertical-align:middle}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:6px 0 10px}
  .kv b{font-weight:600}
  .ctrl{display:flex;gap:6px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
  .ctrl select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid #d4dbe1;border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
  .ctrl button{border:1px solid #d4dbe1;background:#fff;border-radius:6px;font:inherit;font-size:14px;padding:6px 12px;cursor:pointer;color:var(--ink)}
  table.tbl{border-collapse:collapse;font-size:12.5px;margin:4px 0 8px;width:100%;overflow-x:auto;display:block}
  table.tbl th,table.tbl td{border:1px solid var(--line);padding:3px 5px;text-align:center;white-space:nowrap}
  table.tbl th:first-child,table.tbl td:first-child{text-align:left}
  .known-mark{color:var(--ok);font-weight:600;font-size:12.5px;margin-left:6px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:640px){.diagram svg{min-width:520px}.two-col{grid-template-columns:1fr}.opts.two{grid-template-columns:1fr}main,header,nav{padding-left:12px;padding-right:12px}.stage{padding:12px}}
</style>
</head>
<body>
<header>
  <h1>Maapallo ja ilmakehä</h1>
  <p>GE1-kertaus: planetaarisuus, ilmakehä, tuulet, sade, ilmasto ja syklonit. Tutki ensin kaavioita, harjoittele sitten 10 minuutin sessio.</p>
</header>
<nav aria-label="Tila">
  <button id="m-explore" aria-pressed="true">Tutki kaavioita</button>
  <button id="m-flow" class="flow-btn" aria-pressed="false">Harjoittele</button>
</nav>
<main>
  <div class="stage" id="stage"></div>
</main>
<script>
// ---------- data: teemat, kohteet ja 17 kysymyksen vastaukset
const themes=[
  {id:"maa",name:"Maapallo ja energia",short:"Energia",qs:[1,2],dg:"maa"},
  {id:"planeetta",name:"Pyöriminen, kierto ja valaistus",short:"Planetaarisuus",qs:[3,4,5],dg:"valo"},
  {id:"ilmakeha",name:"Ilmakehä ja otsoni",short:"Ilmakehä",qs:[6,7,8],dg:"ilmakeha"},
  {id:"tuulet",name:"Tuuli ja painevyöhykkeet",short:"Tuulet",qs:[9,10],dg:"tuulet"},
  {id:"vesi",name:"Vesi, sade ja merivirrat",short:"Vesi ja sade",qs:[11,12,13,14],dg:"vesi"},
  {id:"ilmasto",name:"Ilmasto, syklonit ja ilmastodiagrammi",short:"Ilmasto",qs:[15,16,17],dg:"sykloni"},
];
const dgOfTheme={maa:["maa"],planeetta:["valo","vuosi"],ilmakeha:["ilmakeha"],tuulet:["tuulet"],vesi:["vesi","sade"],ilmasto:["sykloni","vaiheet","diagrammi"]};
const dgName={maa:"Maan energialähteet ja kehät",valo:"Valaistusvyöhykkeet",vuosi:"Kierto auringon ympäri",ilmakeha:"Ilmakehän kerrokset",tuulet:"Painevyöhykkeet ja tuulet",vesi:"Hydrologinen kierto",sade:"Kolme sadetyyppiä",sykloni:"Sykloni ylhäältä",vaiheet:"Syklonin vaiheet",diagrammi:"Ilmastodiagrammi"};

// Kohteet: name, th (teema), dg (kaavio), where (sijaintivihje), group, why (miksi sillä on väliä)
const items={
  // --- maa
  ydin:{name:"Sisäsyntyinen energia",th:"maa",dg:"maa",where:"Maan sisällä: ydin ja vaippa",group:"Endogeeninen energia",
    why:"Maan sisäinen lämpö (radioaktiivinen hajoaminen ja syntyvaiheen alkulämpö) liikuttaa laattoja. Se synnyttää tulivuoret, maanjäristykset ja vuoristot: sisäsyntyinen energia <b>rakentaa</b> pinnanmuotoja."},
  aurinko:{name:"Ulkosyntyinen energia",th:"maa",dg:"maa",where:"Maan ulkopuolelta: Auringon säteily",group:"Eksogeeninen energia",
    why:"Auringon säteily käyttää ilmakehän ja veden kiertoa: tuulet, sateet, joet, jäätiköt ja aallot rapauttavat, kuluttavat ja kasaavat ainesta. Ulkosyntyinen energia <b>tasoittaa</b> pinnanmuotoja. Myös painovoima lasketaan ulkosyntyiseksi."},
  kivikeha:{name:"Kivikehä (litosfääri)",th:"maa",dg:"maa",where:"Maan kiinteä kuori ja ylin vaippa",group:"Maapallon kehät",
    why:"Kallioperä ja litosfäärilaatat. Laattojen liikkeet muokkaavat mantereita ja meriä."},
  vesikeha:{name:"Vesikehä (hydrosfääri)",th:"maa",dg:"maa",where:"Meret, järvet, joet, pohjavesi",group:"Maapallon kehät",
    why:"Kaikki maapallon vesi. Meret peittävät 71 % pinnasta ja varastoivat lämpöä. Jäätiköt ja lumi lasketaan usein omaksi kehäkseen: lumi- ja jääkehä (kryosfääri)."},
  ilmakehaK:{name:"Ilmakehä (atmosfääri)",th:"maa",dg:"maa",where:"Maata ympäröivä kaasukehä",group:"Maapallon kehät",
    why:"Typpi 78 %, happi 21 %, vähän argonia, hiilidioksidia ja vesihöyryä. Sää ja ilmasto syntyvät sen alimmassa kerroksessa."},
  elonkeha:{name:"Elonkehä (biosfääri)",th:"maa",dg:"maa",where:"Kaikki elollinen kolmen muun kehän rajalla",group:"Maapallon kehät",
    why:"Kasvit, eläimet ja ihmiset. Elonkehä sitoo hiiltä, tuottaa happea ja muokkaa maaperää. Kehät vaikuttavat jatkuvasti toisiinsa."},
  // --- valo / vuosi
  paivantasaaja:{name:"Päiväntasaaja 0°",th:"planeetta",dg:"valo",where:"Pallon keskellä, jakaa pohjoiseen ja eteläiseen pallonpuoliskoon",group:"Leveyspiirit",
    why:"Päivä ja yö ovat aina 12 tuntia. Aurinko on zeniitissä kahdesti vuodessa, tasauspäivinä."},
  kravun:{name:"Kravun kääntöpiiri 23,5° N",th:"planeetta",dg:"valo",where:"Päiväntasaajan pohjoispuolella, Saharan halki",group:"Leveyspiirit",
    why:"Pohjoisin leveyspiiri, jolla aurinko käy zeniitissä: kesäpäivänseisauksena 21.6. Rajaa tropiikin ja pohjoisen lauhkean vyöhykkeen."},
  kauriin:{name:"Kauriin kääntöpiiri 23,5° S",th:"planeetta",dg:"valo",where:"Päiväntasaajan eteläpuolella, Australian ja Brasilian halki",group:"Leveyspiirit",
    why:"Eteläisin leveyspiiri, jolla aurinko käy zeniitissä: talvipäivänseisauksena 21.12. Rajaa tropiikin ja eteläisen lauhkean vyöhykkeen."},
  napapiiriN:{name:"Pohjoinen napapiiri 66,5° N",th:"planeetta",dg:"valo",where:"Rovaniemen korkeudella",group:"Leveyspiirit",
    why:"Pohjoispuolella aurinko ei laske kesäpäivänseisauksena (yötön yö) eikä nouse talvipäivänseisauksena (kaamos). Rajaa lauhkean ja kylmän vyöhykkeen. 90° − 23,5° = 66,5°."},
  napapiiriS:{name:"Eteläinen napapiiri 66,5° S",th:"planeetta",dg:"valo",where:"Etelämantereen rannikon tuntumassa",group:"Leveyspiirit",
    why:"Eteläpuolella yötön yö joulukuussa ja kaamos kesäkuussa. Rajaa eteläisen lauhkean ja kylmän vyöhykkeen."},
  tropiikki:{name:"Tropiikki eli kuuma vyöhyke",th:"planeetta",dg:"valo",where:"Kääntöpiirien välissä 23,5° N – 23,5° S",group:"Valaistusvyöhykkeet",
    why:"Aurinko käy zeniitissä vähintään kerran vuodessa, säteily tulee jyrkästi ja päivä on aina noin 12 tuntia. Siksi kuuma ympäri vuoden ja vuodenaikojen lämpötilaero pieni."},
  lauhkeaN:{name:"Pohjoinen lauhkea vyöhyke",th:"planeetta",dg:"valo",where:"Kravun kääntöpiiristä pohjoiselle napapiirille 23,5°–66,5° N",group:"Valaistusvyöhykkeet",
    why:"Aurinko ei koskaan zeniitissä, ei yötöntä yötä eikä kaamosta. Päivän pituus ja auringon korkeus vaihtelevat selvästi, joten on neljä vuodenaikaa. Suurin osa Suomea kuuluu tähän."},
  lauhkeaS:{name:"Eteläinen lauhkea vyöhyke",th:"planeetta",dg:"valo",where:"Kauriin kääntöpiiristä eteläiselle napapiirille 23,5°–66,5° S",group:"Valaistusvyöhykkeet",
    why:"Sama kuin pohjoisessa, mutta vuodenajat päinvastoin: kesä joulukuussa. Enimmäkseen merta, joten ilmasto on merellinen."},
  kylmaN:{name:"Pohjoinen kylmä vyöhyke",th:"planeetta",dg:"valo",where:"Napapiiriltä pohjoisnavalle 66,5°–90° N",group:"Valaistusvyöhykkeet",
    why:"Kesällä yötön yö, talvella kaamos; navalla kumpikin kestää puoli vuotta. Aurinko paistaa aina matalalta, joten kylmä vaikka kesällä valoa on paljon."},
  kylmaS:{name:"Eteläinen kylmä vyöhyke",th:"planeetta",dg:"valo",where:"Eteläiseltä napapiiriltä etelänavalle 66,5°–90° S",group:"Valaistusvyöhykkeet",
    why:"Etelämanner. Kaamos kesä–heinäkuussa, yötön yö joulukuussa. Maapallon kylmin alue."},
  akseli:{name:"Akselin kaltevuus 23,5°",th:"planeetta",dg:"valo",where:"Pyörimisakseli on kallellaan ratatasoon nähden",group:"Planetaarisuus",
    why:"Kaltevuus on syy vuodenaikoihin: kesällä oma pallonpuolisko on kallistunut aurinkoa kohti. Sama luku 23,5° määrää kääntöpiirit, ja 90° − 23,5° = 66,5° napapiirit."},
  pyoriminen:{name:"Pyöriminen akselinsa ympäri",th:"planeetta",dg:"valo",where:"Länneltä itään, yksi kierros 24 tunnissa",group:"Planetaarisuus",
    why:"Synnyttää vuorokauden (päivä ja yö), Coriolis-ilmiön (liike kääntyy pohjoisessa oikealle, etelässä vasemmalle), aikavyöhykkeet (15° = 1 h), navoilta litistyneen muodon ja yhdessä Kuun kanssa vuoroveden."},
  kevat:{name:"Kevätpäiväntasaus 20.–21.3.",th:"planeetta",dg:"vuosi",where:"Maa auringon ja seisauspisteiden puolivälissä",group:"Tasaus- ja seisauspäivät",
    why:"Aurinko zeniitissä päiväntasaajalla, päivä ja yö 12 h kaikkialla. Pohjoisessa alkaa kevät, valo lisääntyy nopeasti."},
  kesa:{name:"Kesäpäivänseisaus 21.–22.6.",th:"planeetta",dg:"vuosi",where:"Pohjoinen napa kallistunut aurinkoa kohti",group:"Tasaus- ja seisauspäivät",
    why:"Aurinko zeniitissä Kravun kääntöpiirillä. Pohjoisella pallonpuoliskolla vuoden pisin päivä, napapiirin pohjoispuolella yötön yö. Etelässä lyhin päivä ja etelänavalla kaamos."},
  syys:{name:"Syyspäiväntasaus 22.–23.9.",th:"planeetta",dg:"vuosi",where:"Maa taas seisauspisteiden puolivälissä",group:"Tasaus- ja seisauspäivät",
    why:"Aurinko zeniitissä päiväntasaajalla, päivä ja yö 12 h kaikkialla. Pohjoisessa alkaa syksy, etelässä kevät."},
  talvi:{name:"Talvipäivänseisaus 21.–22.12.",th:"planeetta",dg:"vuosi",where:"Pohjoinen napa kallistunut auringosta poispäin",group:"Tasaus- ja seisauspäivät",
    why:"Aurinko zeniitissä Kauriin kääntöpiirillä. Pohjoisessa vuoden lyhin päivä ja napapiirin pohjoispuolella kaamos. Etelässä pisin päivä ja keskikesä."},
  // --- ilmakehä
  tropo:{name:"Troposfääri",th:"ilmakeha",dg:"ilmakeha",where:"Alin kerros, 0–n. 10 km (navoilla 8, päiväntasaajalla 17 km)",group:"Ilmakehän kerrokset",
    why:"Lähes kaikki sää: pilvet, sade, tuulet. 75 % ilmakehän massasta ja lähes kaikki vesihöyry. Lämpötila laskee ylöspäin n. 6,5 °C kilometriä kohti. Yläraja on tropopaussi."},
  strato:{name:"Stratosfääri",th:"ilmakeha",dg:"ilmakeha",where:"n. 10–50 km",group:"Ilmakehän kerrokset",
    why:"Lämpötila nousee ylöspäin, koska otsonikerros imee auringon UV-säteilyä. Ilma on tasaista ja kuivaa; matkustajakoneet lentävät sen alaosassa turbulenssin yläpuolella."},
  otsoni:{name:"Otsonikerros",th:"ilmakeha",dg:"ilmakeha",where:"Stratosfäärissä n. 15–35 km",group:"Ilmakehän kerrokset",
    why:"Otsoni (O₃) imee suurimman osan haitallisesta UV-B- ja UV-C-säteilystä. Ilman sitä elämä maalla olisi mahdotonta. CFC-yhdisteet ohensivat sitä, Montrealin pöytäkirja 1987 kielsi ne."},
  meso:{name:"Mesosfääri",th:"ilmakeha",dg:"ilmakeha",where:"n. 50–85 km",group:"Ilmakehän kerrokset",
    why:"Lämpötila laskee taas ja on ilmakehän kylmin, jopa −90 °C. Meteorit palavat täällä: tähdenlennot."},
  termo:{name:"Termosfääri",th:"ilmakeha",dg:"ilmakeha",where:"n. 85–500 km",group:"Ilmakehän kerrokset",
    why:"Lämpötila nousee satoihin asteisiin, mutta ilma on niin harvaa, ettei sitä tunne. Revontulet syntyvät täällä (100–300 km), ja kansainvälinen avaruusasema kiertää 400 km:ssä. Ionosfääri heijastaa radioaaltoja."},
  ekso:{name:"Eksosfääri",th:"ilmakeha",dg:"ilmakeha",where:"Uloin kerros, yli 500 km",group:"Ilmakehän kerrokset",
    why:"Ilmakehä ohenee vähitellen avaruudeksi. Monet satelliitit kiertävät täällä."},

const cards=[
  {n:1,th:"maa",dg:"maa",q:"Mitä tarkoittavat sisäsyntyinen ja ulkosyntyinen energia?",hl:["ydin","aurinko"],
   html:`<p><b>Sisäsyntyinen (endogeeninen) energia</b> tulee Maan sisältä: ytimen ja vaipan lämmöstä, jota tuottaa radioaktiivisten aineiden hajoaminen. Se liikuttaa litosfäärilaattoja ja synnyttää tulivuoret, maanjäristykset ja vuoristojen poimuttumisen. Se <b>rakentaa</b> ja kohottaa pinnanmuotoja.</p>
   <p><b>Ulkosyntyinen (eksogeeninen) energia</b> tulee Maan ulkopuolelta, lähes kokonaan Auringosta. Säteily käyttää ilmakehän ja veden kiertoa: tuuli, sade, joet, jäätiköt ja aallot rapauttavat, kuluttavat (eroosio) ja kasaavat ainesta. Se <b>tasoittaa</b> pinnanmuotoja. Painovoima lasketaan myös ulkosyntyiseksi.</p>
   <div class="key">Muistisääntö: sisältä rakentuu, ulkoa kuluu.</div>`},
  {n:2,th:"maa",dg:"maa",q:"Mitä eri kehiä maapallolla on?",hl:["kivikeha","vesikeha","ilmakehaK","elonkeha"],
   html:`<ul><li><b>Kivikehä</b> (litosfääri): kuori ja ylin vaippa, laatat.</li><li><b>Vesikehä</b> (hydrosfääri): meret, järvet, joet, pohjavesi.</li><li><b>Ilmakehä</b> (atmosfääri): kaasukehä, jossa sää syntyy.</li><li><b>Elonkehä</b> (biosfääri): kaikki elollinen.</li></ul>
   <p>Usein erotetaan lisäksi <b>lumi- ja jääkehä</b> (kryosfääri: jäätiköt, merijää, ikirouta) ja <b>maaperäkehä</b> (pedosfääri). Kehät vaikuttavat toisiinsa: esimerkiksi tulivuori (kivikehä) syöttää kaasuja ilmakehään, sade (vesikehä) rapauttaa kiveä ja kasvit (elonkehä) sitovat hiilidioksidia.</p>`},
  {n:3,th:"planeetta",dg:"valo",q:"Mitä ilmiöitä syntyy maapallon pyörimisestä oman akselinsa ympäri ja miten ne syntyvät?",hl:["pyoriminen"],
   html:`<p>Maa pyörii akselinsa ympäri länneltä itään kerran 24 tunnissa (rotaatio).</p>
   <ul><li><b>Vuorokausi, päivä ja yö:</b> vain aurinkoa kohti oleva puoli on valossa, ja pyöriminen vaihtaa puolta.</li>
   <li><b>Coriolis-ilmiö:</b> pinnan nopeus on päiväntasaajalla suurin ja navoilla nolla, joten pitkän matkan liike (tuuli, merivirta, sykloni) näyttää kääntyvän: pohjoisella pallonpuoliskolla <b>oikealle</b>, eteläisellä <b>vasemmalle</b>. Siksi pasaatit tulevat koillisesta ja kaakosta ja syklonit pyörivät pohjoisessa vastapäivään.</li>
   <li><b>Aikavyöhykkeet:</b> 360° ÷ 24 h = 15° tunnissa. Itään mentäessä kello siirtyy eteenpäin.</li>
   <li><b>Litistyminen:</b> keskipakoisvoima pullistaa päiväntasaajaa ja litistää napoja.</li>
   <li><b>Vuorovesi:</b> Kuun (ja Auringon) vetovoima nostaa vettä; pyöriminen vie rannikon kahdesti vuorokaudessa nousuveden kohdalle (n. 12 h 25 min välein).</li></ul>`},
  {n:4,th:"planeetta",dg:"vuosi",q:"Mitä ilmiöitä syntyy maapallon kierroksesta auringon ympäri? Tasaus- ja seisauspäivät.",hl:["kevat","kesa","syys","talvi"],
   html:`<p>Maa kiertää Auringon 365,25 vuorokaudessa (revoluutio), ja akseli on koko ajan kallellaan <b>23,5°</b> samaan suuntaan. Siksi säteilyn tulokulma ja päivän pituus vaihtelevat vuoden aikana: syntyvät <b>vuodenajat</b>, päivän pituuden vaihtelu ja auringon korkeuden vaihtelu. Ilman kaltevuutta ei olisi vuodenaikoja.</p>
   <ul><li><b>Kevätpäiväntasaus 20.–21.3.:</b> aurinko zeniitissä päiväntasaajalla, päivä ja yö 12 h kaikkialla.</li>
   <li><b>Kesäpäivänseisaus 21.–22.6.:</b> aurinko zeniitissä Kravun kääntöpiirillä. Pohjoisessa pisin päivä, napapiirin pohjoispuolella yötön yö; etelässä lyhin päivä.</li>
   <li><b>Syyspäiväntasaus 22.–23.9.:</b> kuten keväällä, aurinko zeniitissä päiväntasaajalla.</li>
   <li><b>Talvipäivänseisaus 21.–22.12.:</b> aurinko zeniitissä Kauriin kääntöpiirillä. Pohjoisessa lyhin päivä ja kaamos napapiirin pohjoispuolella; etelässä keskikesä.</li></ul>
   <div class="key">Tasauspäivä = päivä ja yö tasan. Seisauspäivä = aurinko "seisahtuu" kääntöpiirillä ja kääntyy takaisin.</div>`},
  {n:5,th:"planeetta",dg:"valo",q:"Mitkä ovat maapallon valaistusvyöhykkeet, mitkä leveyspiirit niitä rajaavat ja millaiset ovat valaistusolot?",hl:["tropiikki","lauhkeaN","lauhkeaS","kylmaN","kylmaS"],
   html:`<ul><li><b>Tropiikki eli kuuma vyöhyke</b>, Kravun ja Kauriin kääntöpiirien välissä (23,5° N – 23,5° S): aurinko zeniitissä vähintään kerran vuodessa, päivä aina noin 12 h, lämmintä ympäri vuoden.</li>
   <li><b>Lauhkeat vyöhykkeet</b> (kaksi), kääntöpiiristä napapiirille (23,5°–66,5°): aurinko ei koskaan zeniitissä, ei yötöntä yötä eikä kaamosta, päivän pituus vaihtelee paljon → neljä vuodenaikaa.</li>
   <li><b>Kylmät eli polaariset vyöhykkeet</b> (kaksi), napapiiriltä navalle (66,5°–90°): kesällä yötön yö, talvella kaamos, navoilla puoli vuotta kumpaakin; aurinko aina matalalla.</li></ul>
   <div class="key">Rajat: 23,5° kääntöpiirit, 66,5° napapiirit. 23,5 + 66,5 = 90.</div>`},
  {n:6,th:"ilmakeha",dg:"ilmakeha",q:"Ilmakehän kerrokset lämpötilan mukaan ja niiden ilmiöt",hl:["tropo","strato","meso","termo","ekso"],
   html:`<ul><li><b>Troposfääri</b> 0–n. 10 km: lämpötila laskee ylöspäin (6,5 °C/km). Sää: pilvet, sade, tuulet; 75 % ilmasta, lähes kaikki vesihöyry.</li>
   <li><b>Stratosfääri</b> 10–50 km: lämpötila nousee, koska <b>otsonikerros</b> (15–35 km) imee UV-säteilyä. Tasaista, matkustajakoneet.</li>
   <li><b>Mesosfääri</b> 50–85 km: lämpötila laskee, kylmin kohta (−90 °C). Meteorit palavat: tähdenlennot.</li>
   <li><b>Termosfääri</b> 85–500 km: lämpötila nousee satoihin asteisiin harvassa ilmassa. Revontulet, ionosfääri, avaruusasema.</li>
   <li><b>Eksosfääri</b> yli 500 km: siirtymä avaruuteen, satelliitteja.</li></ul>
   <div class="key">Lämpötila: laskee – nousee – laskee – nousee. Kerrosten rajat ovat "-paussit" (tropopaussi, stratopaussi, mesopaussi).</div>`},
  {n:7,th:"ilmakeha",dg:"ilmakeha",q:"Mikä on ilmakehän merkitys maapallolle?",hl:["tropo","otsoni"],
   html:`<ul><li><b>Kasvihuoneilmiö:</b> vesihöyry, hiilidioksidi ja metaani pidättävät lämpöä. Keskilämpötila on +15 °C; ilman ilmakehää −18 °C.</li>
   <li><b>Tasaa lämpötilaeroja</b> päivän ja yön sekä alueiden välillä; tuulet ja pilvet kuljettavat lämpöä ja kosteutta.</li>
   <li><b>Suojaa säteilyltä:</b> otsonikerros imee UV-säteilyn, ilmakehä ja magneettikenttä torjuvat kosmista säteilyä.</li>
   <li><b>Suojaa meteoreilta:</b> useimmat palavat mesosfäärissä.</li>
   <li><b>Elämän kaasut:</b> happi hengitykseen ja palamiseen, hiilidioksidi yhteyttämiseen, typpi.</li>
   <li><b>Veden kierto:</b> ilman ilmakehää ei olisi pilviä, sadetta eikä makeaa vettä.</li></ul>`},
  {n:8,th:"ilmakeha",dg:"ilmakeha",q:"Mikä on otsonikerros ja miksi se on tärkeä elämälle?",hl:["otsoni"],
   html:`<p>Otsonikerros on stratosfäärin osa noin 15–35 km korkeudessa, jossa otsonia (O₃, kolmiatominen happi) on eniten. Se <b>imee suurimman osan auringon UV-B- ja UV-C-säteilystä</b>, joka muuten aiheuttaisi ihosyöpää, silmävaurioita ja tuhoaisi kasviplanktonia ja viljelykasveja. Elämä pääsi maalle vasta, kun otsonikerros oli syntynyt.</p>
   <p>1900-luvulla kylmälaitteiden ja suihkepullojen <b>CFC-yhdisteet</b> (freonit) hajottivat otsonia, ja Etelämantereen ylle syntyi keväisin <b>otsoniaukko</b>. <b>Montrealin pöytäkirja 1987</b> kielsi CFC:t, ja kerros elpyy hitaasti.</p>
   <div class="key">Huom: sama otsoni on troposfäärissä haitallinen saaste (savusumu). Otsonikato ja ilmastonmuutos ovat eri ongelmia.</div>`},
  {n:9,th:"tuulet",dg:"tuulet",q:"Miten tuuli syntyy?",hl:["L0","H30N"],
   html:`<ol><li>Aurinko lämmittää maanpintaa <b>epätasaisesti</b>.</li>
   <li>Lämmin ilma laajenee, kevenee ja <b>kohoaa</b> → pinnalle syntyy <b>matalapaine</b>. Kylmä ilma tiivistyy ja <b>laskeutuu</b> → <b>korkeapaine</b>.</li>
   <li>Ilma virtaa <b>korkeapaineesta matalapaineeseen</b>: tämä virtaus on tuuli. Mitä suurempi paine-ero (tiheämmät isobaarit), sitä kovempi tuuli.</li>
   <li><b>Coriolis-ilmiö</b> kääntää tuulen suuntaa: pohjoisessa oikealle, etelässä vasemmalle.</li></ol>
   <p>Esimerkki pienessä mittakaavassa: päivällä maa lämpenee merta nopeammin → maalla matalapaine → <b>merituuli</b> puhaltaa mereltä maalle. Yöllä päinvastoin: maatuuli.</p>`},
  {n:10,th:"tuulet",dg:"tuulet",q:"Planetaariset korkea- ja matalapaineen alueet ja niiden väliset tuulet",hl:["L0","H30N","L60N","HN","pasaatiN","lansiN","itaN"],
   html:`<p><b>Painevyöhykkeet</b> (molemmilla pallonpuoliskoilla):</p>
   <ul><li><b>0° matalapaine</b>: lämmin ilma kohoaa, sateista (ITCZ).</li><li><b>30° korkeapaine</b> (subtrooppinen): laskeva kuiva ilma, aavikot.</li><li><b>60° matalapaine</b> (polaaririntama): lämmin ja kylmä ilma kohtaavat, syklonit.</li><li><b>90° korkeapaine</b>: kylmä laskeva ilma.</li></ul>
   <p><b>Tuulet</b> puhaltavat korkeasta matalaan ja Coriolis kääntää ne:</p>
   <ul><li><b>Pasaatituulet</b> 30° → 0°: koillispasaati pohjoisessa, kaakkoispasaati etelässä.</li><li><b>Länsituulet</b> 30° → 60°: lounaasta pohjoisessa, luoteesta etelässä. Suomi on länsituulten vyöhykkeellä.</li><li><b>Polaariset itätuulet</b> 90° → 60°.</li></ul>
   <p>Kiertosolut: Hadleyn solu (0–30°), Ferrelin solu (30–60°) ja polaarisolu (60–90°). Koko järjestelmä siirtyy vuodenaikojen mukana muutaman asteen auringon perässä.</p>`},
  {n:11,th:"vesi",dg:"vesi",q:"Käy läpi hydrologinen kierto.",hl:["haihtuminen","tiivistyminen","sadanta","pintavalunta","imeytyminen","pohjavesi"],
   html:`<p>Auringon energia käyttää kiertoa, veden kokonaismäärä ei muutu.</p>
   <ol><li><b>Haihtuminen</b> meristä (suurin osa), järvistä ja maasta sekä <b>kasvien haihdunta</b> (transpiraatio).</li>
   <li>Vesihöyry kohoaa ja jäähtyy → <b>tiivistyminen</b> pilviksi.</li>
   <li><b>Sadanta</b> vetenä tai lumena; lumi voi varastoitua jäätiköihin.</li>
   <li>Osa valuu <b>pintavaluntana</b> puroihin ja jokiin, osa <b>imeytyy</b> maahan <b>pohjavedeksi</b>.</li>
   <li>Joet ja pohjavesi palauttavat veden mereen, ja kierto alkaa alusta.</li></ol>
   <div class="key">Vesi viipyy ilmakehässä keskimäärin 9 päivää, valtameressä tuhansia vuosia.</div>`},
  {n:12,th:"vesi",dg:"sade",q:"Miten sade syntyy? Orografinen sade, rintamasade ja konvektiosade",hl:["orografinen","rintamasade","konvektio"],
   html:`<p>Sade syntyy aina samalla tavalla: kostea ilma <b>kohoaa</b> → <b>jäähtyy</b> (n. 1 °C / 100 m) → vesihöyry <b>tiivistyy</b> pilvipisaroiksi → pisarat kasvavat ja putoavat. Sadetyypit eroavat siinä, <b>mikä nostaa ilman</b>:</p>
   <ul><li><b>Orografinen sade:</b> vuori pakottaa tuulen nousemaan. Tuulenpuoleinen rinne sateinen, suojan puoli kuiva (<b>sadevarjo</b>). Norjan rannikko, Himalaja, Andit.</li>
   <li><b>Rintamasade:</b> lämmin ilma nousee kylmän ilmamassan päälle. Laaja, tasainen, pitkäkestoinen. Lauhkea vyöhyke, syklonit, Suomen syksy ja talvi.</li>
   <li><b>Konvektiosade:</b> kuuma maa lämmittää ilmaa, joka kohoaa nopeasti. Kuuropilvi, rankka lyhyt sade, ukkonen, iltapäivällä. Tropiikki päivittäin, Suomi kesällä.</li></ul>`},
  {n:13,th:"vesi",dg:"tuulet",q:"Maapallon sateisimmat ja kuivimmat alueet ja miksi",hl:["L0","H30N","H30S","HN","HS"],
   html:`<p><b>Sateisimmat:</b></p><ul><li><b>Päiväntasaajan seutu</b> (Amazonia, Kongo, Indonesia): kuuma kostea ilma kohoaa, konvektiosateita lähes joka päivä, matalapaine.</li><li><b>Monsuunialueet</b> (Intia, Bangladesh): kesämonsuuni tuo mereltä kosteaa ilmaa. Maailman sateisin paikka on Himalajan juurella (Mawsynram).</li><li><b>Vuoristojen tuulenpuoleiset rinteet</b> länsituulten alueella (Norjan länsirannikko, Uuden-Seelannin länsirannikko): orografinen sade.</li></ul>
   <p><b>Kuivimmat:</b></p><ul><li><b>Kääntöpiirien seutu 20–30°</b> (Sahara, Arabia, Kalahari, Australia): korkeapaine, laskeva ilma lämpenee eikä tiivisty.</li><li><b>Kylmien merivirtojen rannikot</b> (Atacama: Humboldtin virta; Namib: Benguelan virta): viileä ilma ei kohoa, vain sumua.</li><li><b>Sadevarjot ja mannerten sisäosat</b> (Gobi, Keski-Aasia): kaukana merestä ja vuorten suojassa.</li><li><b>Napa-alueet</b>: kylmä ilma sisältää hyvin vähän kosteutta. Etelämanner on kylmä aavikko.</li></ul>`},
  {n:14,th:"vesi",dg:"tuulet",q:"Miksi merissä on merivirtoja? Mitä kylmät ja lämpimät virrat aiheuttavat?",hl:["pasaatiN","lansiN"],
   html:`<p><b>Syyt:</b> vallitsevat <b>tuulet</b> (pasaatit ja länsituulet) työntävät pintavettä; <b>Coriolis-ilmiö</b> kääntää virrat kehiksi (pohjoisessa myötäpäivään, etelässä vastapäivään); <b>mantereiden rannat</b> ohjaavat; veden <b>lämpötila- ja suolaisuuserot</b> (tiheys) synnyttävät syvän termohaliinisen kierron.</p>
   <p><b>Lämpimät virrat</b> kulkevat päiväntasaajalta napoja kohti: lämmittävät ja kosteuttavat rannikkoa, lisäävät sateita, satamat jäättömiä. Esim. Golfvirta ja Pohjois-Atlantin virta tekevät Norjasta ja Suomesta leutoja.</p>
   <p><b>Kylmät virrat</b> kulkevat navoilta päiväntasaajaa kohti: viilentävät rannikkoa, ilma ei kohoa → vähän sadetta, sumua, rannikkoaavikoita (Humboldt → Atacama, Benguela → Namib, Kanarianvirta → Länsi-Sahara). Ravinteikkaita: hyvät kalavedet.</p>
   <p>Yksityiskohtaisemmin merivirtoja voi harjoitella <a href="../merivirrat/">merivirtapelissä</a>.</p>`},
  {n:15,th:"ilmasto",dg:"diagrammi",q:"Ilmastovyöhykkeet ja ilmastoon vaikuttavat tekijät",hl:[],
   html:`<p><b>Ilmastovyöhykkeet:</b></p><ul><li><b>Kuuma eli trooppinen:</b> joka kuukausi yli 18 °C. Sademetsäilmasto (sadetta aina) ja savanni-ilmasto (sadekausi ja kuiva kausi).</li><li><b>Kuiva:</b> haihdunta suurempi kuin sadanta. Aavikko (alle 250 mm) ja aro.</li><li><b>Lauhkea:</b> välimeren ilmasto (kuiva kuuma kesä, sateinen leuto talvi), lauhkea merellinen (tasainen, sateinen: Länsi-Eurooppa), lauhkea mannerilmasto (kuuma kesä, kylmä talvi).</li><li><b>Kylmä eli boreaalinen:</b> pitkä lumitalvi, lyhyt kesä. Suomi.</li><li><b>Polaarinen:</b> tundra (lämpimin kuukausi 0–10 °C) ja jäätikköilmasto (aina alle 0 °C).</li><li><b>Vuoristoilmasto</b> korkeuden mukaan.</li></ul>
   <p><b>Ilmastoon vaikuttavat tekijät:</b></p><ul><li><b>Leveysaste:</b> säteilyn tulokulma ja päivän pituus.</li><li><b>Korkeus merenpinnasta:</b> −6,5 °C / km.</li><li><b>Meren läheisyys:</b> merellisyys tasaa (pieni vuosivaihtelu), mantereisuus kärjistää (suuri vuosivaihtelu).</li><li><b>Merivirrat:</b> lämmin lämmittää ja kosteuttaa, kylmä viilentää ja kuivattaa.</li><li><b>Vallitsevat tuulet ja painevyöhykkeet:</b> länsituulet tuovat sateet, 30° korkeapaine kuivuuden.</li><li><b>Vuoristot:</b> sadevarjo, tuulen este.</li><li><b>Pinnan laatu:</b> lumi heijastaa (albedo), tumma maa lämpenee.</li></ul>`},
  {n:16,th:"ilmasto",dg:"vaiheet",q:"Miten syklonit syntyvät? Vaiheet, rintamat ja piirtäminen",hl:["Lkeskus","lamminR","kylmaR","sektori","liike"],
   html:`<p>Liikkuva matalapaine eli sykloni syntyy <b>polaaririntamalla</b> (n. 60°), jossa lämmin trooppinen ilma ja kylmä polaarinen ilma kohtaavat.</p>
   <ol><li><b>Rintama:</b> ilmamassat liikkuvat vastakkaisiin suuntiin suoraa rintamaa pitkin.</li>
   <li><b>Aalto:</b> rintamaan syntyy aalto, lämmin ilma työntyy kylmään ja paine laskee: syntyy keskus L.</li>
   <li><b>Kypsä sykloni:</b> keskuksen edessä (kaakossa) <b>lämmin rintama</b>, takana (lounaassa) <b>kylmä rintama</b>, välissä <b>lämmin sektori</b>. Ilma kiertää keskusta vastapäivään ja koko sykloni liikkuu länsituulten mukana itään.</li>
   <li><b>Okluusio:</b> nopeampi kylmä rintama saa lämpimän kiinni ja nostaa lämpimän ilman kokonaan ylös: okluusiorintama.</li>
   <li><b>Hajoaminen:</b> lämmin ilma on nostettu, paine-ero tasoittuu ja sykloni täyttyy.</li></ol>
   <p><b>Sää syklonin ohittaessa:</b> ensin korkeat cirruspilvet, pilvet paksuuntuvat ja laskevat, lämpimän rintaman edellä tasainen sade, lämpimässä sektorissa lämpenee ja sade tauolla, kylmällä rintamalla kuurot ja ukkonen, tuuli kääntyy, sitten kirkastuu ja viilenee.</p>
   <div class="key">Piirrä: L keskelle, lämmin rintama (punainen, puoliympyrät) keskuksesta kaakkoon, kylmä rintama (sininen, kolmiot) lounaaseen, merkit liikesuuntaan, kaarevat nuolet vastapäivään ja liikesuuntanuoli itään. Kokeile "Piirrä vaihe vaiheelta" -kaaviossa.</div>`},
  {n:17,th:"ilmasto",dg:"diagrammi",q:"Ilmastodiagrammin piirtäminen ja tulkinta",hl:["lampokayra","sadepylvaat","kuivakausi"],
   html:`<p><b>Piirtäminen:</b> vaaka-akselille 12 kuukautta (T H M H T K H E S L M J). Vasen pystyakseli lämpötila °C, oikea sademäärä mm asteikolla <b>1 °C = 2 mm</b> (10 °C on samalla korkeudella kuin 20 mm). Kuukausien keskilämpötilat pisteinä ja yhdistetään <b>punaiseksi käyräksi</b>; sademäärät <b>sinisinä pylväinä</b>. Otsikkoon paikka, korkeus, vuoden keskilämpötila ja vuosisademäärä.</p>
   <p><b>Tulkinta vaihe vaiheelta:</b></p><ol><li><b>Pallonpuolisko:</b> lämpimin kuukausi kesä–elokuussa → pohjoinen; joulu–helmikuussa → eteläinen; tasainen käyrä → tropiikki.</li><li><b>Lämpötila:</b> vuoden keskilämpötila (kuuma / lauhkea / kylmä) ja vuosivaihtelu = lämpimin − kylmin (pieni: merellinen tai trooppinen; suuri: mantereinen).</li><li><b>Sade:</b> vuosisademäärä ja jakautuminen. Kun pylväs jää lämpökäyrän alle → <b>kuiva kausi</b>.</li><li><b>Ilmastotyyppi:</b> esim. aina yli 18 °C ja sateista = sademetsä; kesäsateet ja kuiva talvi = savanni tai monsuuni; kuiva kesä ja leuto sateinen talvi = välimeren; alle 250 mm = aavikko; pitkä pakkastalvi = boreaalinen.</li><li><b>Selitä syyt</b> tekijöillä: leveysaste, meri, merivirrat, tuulet, vuoristot.</li></ol>`},
];

const climTypes=["sademetsä","savanni/monsuuni","aavikko","välimeren","lauhkea merellinen","lauhkea","boreaalinen","tundra"];

const MONF=["tammikuu","helmikuu","maaliskuu","huhtikuu","toukokuu","kesäkuu","heinäkuu","elokuu","syyskuu","lokakuu","marraskuu","joulukuu"];
// ---------- kaaviot (SVG). DG[id](hl, opts) -> svg-merkkijono. hl = korostettu kohde (id tai lista), opts.labels=false piilottaa nimilaput.
const DEFS=`<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c2a36"/></marker>
<marker id="a-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d1452b"/></marker>
<marker id="a-cold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2757a8"/></marker>
<marker id="a-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f6f8b"/></marker>
<marker id="a-sun" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a020"/></marker>
</defs>`;
const svgOpen=(w,h)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${DEFS}`;
const isHl=(hl,id)=>Array.isArray(hl)?hl.includes(id):hl===id;
const hit=(id,inner,hl)=>`<g class="hit${isHl(hl,id)?" hl":""}" data-item="${id}" tabindex="0" role="button" aria-label="${items[id]?items[id].name:id}">${inner}</g>`;
const T=(x,y,t,o={})=>`<text class="${o.ax?"ax":"lbl"}${o.hide?" hidden":""}" x="${x}" y="${y}" font-size="${o.s||12.5}" text-anchor="${o.a||"start"}" fill="${o.c||"#1c2a36"}" font-weight="${o.w||400}">${t}</text>`;
const arrow=(x1,y1,x2,y2,c="ink",w=2,extra="")=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${{ink:"#1c2a36",warm:"#d1452b",cold:"#2757a8",acc:"#1f6f8b",sun:"#e0a020"}[c]}" stroke-width="${w}" marker-end="url(#a-${c})" ${extra}/>`;
const cloud=(x,y,s=1,c="#dfe7ee")=>`<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="0" rx="34" ry="14" fill="${c}"/><circle cx="-12" cy="-8" r="13" fill="${c}"/><circle cx="6" cy="-11" r="15" fill="${c}"/><circle cx="20" cy="-4" r="11" fill="${c}"/></g>`;
const rain=(x,y,n=4,len=14,c="#2757a8")=>{let s="";for(let i=0;i<n;i++)s+=`<line x1="${x+i*9}" y1="${y}" x2="${x+i*9-4}" y2="${y+len}" stroke="${c}" stroke-width="1.6"/>`;return s;};
const sun=(x,y,r=16)=>{let s=`<circle cx="${x}" cy="${y}" r="${r}" fill="#f2b134"/>`;for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<line x1="${x+Math.cos(a)*(r+5)}" y1="${y+Math.sin(a)*(r+5)}" x2="${x+Math.cos(a)*(r+13)}" y2="${y+Math.sin(a)*(r+13)}" stroke="#f2b134" stroke-width="2.5"/>`}return s;};
const DG={};

// --- Maan energialähteet ja kehät
DG.maa=(hl,o={})=>{
  const H=o.labels!==false?{}:{hide:true};
  let s=svgOpen(640,380);
  // Earth cross-section
  s+=`<circle cx="190" cy="220" r="150" fill="#8a6d3b"/><circle cx="190" cy="220" r="142" fill="#e2893a"/><circle cx="190" cy="220" r="62" fill="#f0c04a"/>`;
  s+=T(190,224,"ydin",{a:"middle",s:12,w:600,ax:true})+T(190,140,"vaippa",{a:"middle",s:12,ax:true})+T(190,82,"kuori",{a:"middle",s:11,ax:true});
  // volcano on surface (top-right of circle)
  s+=`<polygon points="285,108 320,60 355,108" fill="#7b5a3a"/><path d="M312 60 L320 40 L328 60" fill="#d1452b"/><path d="M300 75 q20 -35 40 0" fill="none" stroke="#d1452b" stroke-width="3"/>`;
  s+=hit("ydin",`<circle class="zone" cx="190" cy="220" r="150" fill="transparent" stroke="none"/>`+arrow(230,180,300,110,"warm",2.5)+T(300,150,"laattaliikunnot, tulivuoret,",Object.assign({s:11.5,c:"#8a2a1a"},H))+T(300,164,"maanjäristykset, vuoret",Object.assign({s:11.5,c:"#8a2a1a"},H))+T(300,182,"→ rakentaa pinnanmuotoja",Object.assign({s:11.5,w:600,c:"#8a2a1a"},H))+T(60,60,"Sisäsyntyinen energia",Object.assign({s:14,w:600,c:"#8a2a1a"},H))+T(60,76,"Maan sisäinen lämpö",Object.assign({s:11.5,c:"#8a2a1a"},H)),hl);
  // sun and exogenic arrows
  s+=hit("aurinko",`<circle class="zone" cx="560" cy="60" r="44" fill="transparent"/>`+sun(560,60,22)+arrow(530,95,470,150,"sun",2.5)+arrow(560,95,560,150,"sun",2.5)+T(430,205,"tuuli, sade, joet, jäätiköt, aallot",Object.assign({s:11.5,c:"#8a6a10"},H))+T(430,221,"→ rapauttaa, kuluttaa, kasaa",Object.assign({s:11.5,c:"#8a6a10"},H))+T(430,239,"→ tasoittaa pinnanmuotoja",Object.assign({s:11.5,w:600,c:"#8a6a10"},H))+T(415,35,"Ulkosyntyinen energia",Object.assign({s:14,w:600,c:"#8a6a10"},H))+T(415,51,"Auringon säteily",Object.assign({s:11.5,c:"#8a6a10"},H)),hl);

// --- Valaistusvyöhykkeet (globe tilted 23.5°, sun on the right: 21.6.)

  const pt=(lat,side)=>rot(side*R*Math.cos(lat*Math.PI/180),-R*Math.sin(lat*Math.PI/180));
  const band=(a,b)=>{let p=[];for(let l=a;l<=b;l+=2)p.push(pt(l,1));for(let l=b;l>=a;l-=2)p.push(pt(l,-1));return p.map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" ");};
  const mid=lat=>rot(0,-R*Math.sin(lat*Math.PI/180));
  let s=svgOpen(640,430);

  // axis: hit region first (zones cover it inside the globe), visible line later

  s+=hit("akseli",`<line class="zone" x1="${ax1}" y1="${ay1}" x2="${ax2}" y2="${ay2}" stroke="transparent" stroke-width="14"/><circle cx="${ax1}" cy="${ay1}" r="16" fill="transparent"/>`+T(cx-10,cy-R-30,"akseli 23,5°",Object.assign({a:"end",s:11.5},H)),hl);
  const zones=[["kylmaN",66.5,90,"#cfe3ef","Kylmä vyöhyke",78],["lauhkeaN",23.5,66.5,"#dcebd2","Lauhkea vyöhyke",45],["tropiikki",-23.5,23.5,"#fbe3c4","Tropiikki",0],["lauhkeaS",-66.5,-23.5,"#dcebd2","Lauhkea vyöhyke",-45],["kylmaS",-90,-66.5,"#cfe3ef","Kylmä vyöhyke",-78]];
  zones.forEach(([id,a,b,c,n,m])=>{const [mx,my]=mid(m);s+=hit(id,`<polygon class="zone" points="${band(a,b)}" fill="${c}" stroke="#fff" stroke-width="1"/>`+T(mx,my+4,n,Object.assign({a:"middle",s:12.5,w:600},H)),hl);});
  // night shading (left half, sun at right)
  s+=`<rect x="${cx-R-2}" y="${cy-R-2}" width="${R+2}" height="${2*R+4}" fill="#1c2a36" opacity=".28" clip-path="url(#globe)" pointer-events="none"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#1c2a36" stroke-width="1.5" pointer-events="none"/>`;
  // latitude lines
  const lines=[["paivantasaaja",0,"Päiväntasaaja 0°"],["kravun",23.5,"Kravun kääntöpiiri 23,5° N"],["kauriin",-23.5,"Kauriin kääntöpiiri 23,5° S"],["napapiiriN",66.5,"Pohjoinen napapiiri 66,5° N"],["napapiiriS",-66.5,"Eteläinen napapiiri 66,5° S"]];
  lines.forEach(([id,lat,n])=>{const [x1,y1]=pt(lat,-1),[x2,y2]=pt(lat,1);const dash=lat===0?"":"6 4";
    s+=hit(id,`<line class="zone" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="10"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1c2a36" stroke-width="${lat===0?2.2:1.4}" stroke-dasharray="${dash}" pointer-events="none"/>`+T(x1-8,y1+4,n,Object.assign({a:"end",s:11.5},H)),hl);});
  s+=`<line x1="${ax1}" y1="${ay1}" x2="${ax2}" y2="${ay2}" stroke="#1c2a36" stroke-width="2" pointer-events="none"/><line x1="${cx}" y1="${cy-R-28}" x2="${cx}" y2="${cy-R+10}" stroke="#5b6b78" stroke-width="1" stroke-dasharray="3 3" pointer-events="none"/>`+T(ax1+6,ay1-2,"N",{s:12,w:600,ax:true})+T(ax2+6,ay2+12,"S",{s:12,w:600,ax:true});
  // rotation arrow around north pole
  const [rx,ry]=rot(0,-R-44);
  s+=hit("pyoriminen",`<path class="zone" d="M${rx-45} ${ry+12} q45 -28 90 0" fill="none" stroke="transparent" stroke-width="18"/><path d="M${rx-45} ${ry+12} q45 -28 90 0" fill="none" stroke="#1f6f8b" stroke-width="2" marker-end="url(#a-acc)" pointer-events="none"/>`+T(rx+52,ry+4,"pyörii länneltä itään, 24 h",Object.assign({s:11.5,c:"#1f6f8b"},H)),hl);
  // sun rays from the right
  s+=sun(608,215,20);
  for(let y=80;y<=350;y+=45)s+=arrow(580,y,cx+R+16,y,"sun",1.8);
  s+=T(600,262,"21.6.",{a:"middle",s:12,w:600,ax:true})+T(600,276,"pohjoinen",{a:"middle",s:11,ax:true})+T(600,289,"kesä",{a:"middle",s:11,ax:true});
  s+=T(20,408,"Varjostettu puoli on yössä. Tilanne 21.6.: pohjoinen napa-alue on kokonaan valossa (yötön yö),",{s:11,c:"#5b6b78",ax:true})+T(20,422,"eteläinen kokonaan pimeässä (kaamos). Talvella 21.12. tilanne on päinvastainen.",{s:11,c:"#5b6b78",ax:true});

  s+=panel("konvektio",428,p3,"Konvektiosade","tropiikki, kesäukkoset, iltapäivä");

// --- Sykloni ylhäältä. opts.step: 1 L, 2 +lämmin rintama, 3 +kylmä rintama, 4 +sektori ja ilmamassat, 5 +kierto ja liike (oletus kaikki)
function frontPath(x1,y1,x2,y2,kind,color){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),d=[dx/len,dy/len];let n=[-d[1],d[0]];
  if(kind==="warm"&&n[0]<0)n=[-n[0],-n[1]];if(kind==="cold"&&n[0]<0)n=[-n[0],-n[1]];
  let s=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="3"/>`;
  [0.25,0.5,0.75].forEach(t=>{const px=x1+dx*t,py=y1+dy*t;
    if(kind==="warm"){let pts=[];for(let a=0;a<=Math.PI;a+=Math.PI/8){pts.push(`${(px+9*Math.cos(a)*d[0]+9*Math.sin(a)*n[0]).toFixed(1)},${(py+9*Math.cos(a)*d[1]+9*Math.sin(a)*n[1]).toFixed(1)}`);}s+=`<polygon points="${pts.join(" ")}" fill="${color}"/>`;}
    else{s+=`<polygon points="${px-9*d[0]},${py-9*d[1]} ${px+9*d[0]},${py+9*d[1]} ${px+15*n[0]},${py+15*n[1]}" fill="${color}"/>`;}});
  return s;
}

    s+=`<polygon points="${L[0]-30},${L[1]+20} ${CF[0]-20},${CF[1]+10} ${CF[0]+10},${CF[1]+30} ${L[0]-5},${L[1]+35}" fill="#2757a8" opacity=".14" pointer-events="none"/>`+T(135,300,"kuurot, ukkonen",{s:10,c:"#2757a8",ax:true});

  if(step>=3)s+=hit("kylmaR",`<line class="zone" x1="${L[0]}" y1="${L[1]}" x2="${CF[0]}" y2="${CF[1]}" stroke="transparent" stroke-width="26"/>`+frontPath(L[0],L[1],CF[0],CF[1],"cold","#2757a8")+T(CF[0]+20,CF[1]+34,"kylmä rintama",Object.assign({s:12.5,w:600,c:"#2757a8"},H)),hl);
  if(step>=5){
    const arc=(r,a1,a2)=>{const p=a=>[L[0]+r*Math.cos(a),L[1]+r*Math.sin(a)];const [x1,y1]=p(a1),[x2,y2]=p(a2);return `<path d="M${x1} ${y1} A${r} ${r} 0 0 0 ${x2} ${y2}" fill="none" stroke="#1c2a36" stroke-width="1.8" marker-end="url(#a-ink)"/>`;};
    s+=arc(70,0.3,-1.4)+arc(100,-2.0,-3.6)+arc(120,2.8,1.3)+T(210,120,"vastapäivään",{s:10.5,ax:true});
    s+=hit("liike",`<rect class="zone" x="330" y="40" width="150" height="40" fill="transparent"/>`+arrow(340,60,470,60,"ink",3)+T(405,50,"liikesuunta: itään",Object.assign({a:"middle",s:12,w:600},H)),hl);
  }
  if(step>=1)s+=hit("Lkeskus",`<circle class="zone" cx="${L[0]}" cy="${L[1]}" r="26" fill="#fff" stroke="#1c2a36" stroke-width="1.5"/><text x="${L[0]}" y="${L[1]+9}" font-size="26" font-weight="700" text-anchor="middle" fill="#1c2a36">L</text>`+T(L[0]+32,L[1]-14,"matalapaineen keskus",Object.assign({s:11.5},H)),hl);
  s+=T(20,408,"Pohjoinen pallonpuolisko, katsottuna ylhäältä. Pohjoinen on ylhäällä.",{s:10.5,c:"#5b6b78",ax:true});

};

// --- Ilmastodiagrammi. opts.upto = montako kuukautta piirretty (0–12), opts.labels=false piilottaa nimen ja tyypin, opts.hideTitle
DG.diagrammi=(hl,o={})=>{
  const st=o.station||stations[0];const upto=o.upto===undefined?12:o.upto;
  const tmin=Math.min(0,Math.floor(Math.min(...st.t)/10)*10);const pmax=Math.max(...st.p);
  const topU=pmax>100?50+(pmax-100)/10+5:50; // yksikkö = °C-ekvivalentti (1 °C = 2 mm alle 100 mm, sitten 1 °C = 10 mm)
  const unit=Math.min(3.2,300/(topU-tmin));const x0=70,y0=40+ (topU-tmin)*unit,W=480,colW=W/12;
  const Y=u=>y0-(u-tmin)*unit;const Yp=mm=>mm<=100?Y(mm/2):Y(50+(mm-100)/10);
  const h=Math.round(y0+56);
  let s=svgOpen(640,h);
  s+=`<rect x="${x0}" y="${Y(topU)}" width="${W}" height="${y0-Y(topU)}" fill="#fff" stroke="#c7d0d8"/>`;
  // grid & axes
  for(let t=tmin;t<=Math.min(topU,50);t+=10){s+=`<line x1="${x0}" y1="${Y(t)}" x2="${x0+W}" y2="${Y(t)}" stroke="${t===0?"#5b6b78":"#eef1f4"}" stroke-width="${t===0?1.2:1}"/>`+T(x0-6,Y(t)+4,t,{a:"end",s:10.5,c:"#d1452b",ax:true})+T(x0+W+6,Y(t)+4,t*2,{s:10.5,c:"#2757a8",ax:true});}
  if(topU>50)for(let mm=200;mm<=pmax+50;mm+=100){if(Yp(mm)<Y(topU))break;s+=`<line x1="${x0}" y1="${Yp(mm)}" x2="${x0+W}" y2="${Yp(mm)}" stroke="#eef1f4"/>`+T(x0+W+6,Yp(mm)+4,mm,{s:10.5,c:"#2757a8",ax:true});}
  s+=T(x0-6,Y(topU)-8,"°C",{a:"end",s:10.5,c:"#d1452b",ax:true})+T(x0+W+6,Y(topU)-8,"mm",{s:10.5,c:"#2757a8",ax:true});
  // dry season shading
  let dry="";
  st.t.forEach((t,i)=>{if(i<upto&&st.p[i]<2*t){const x=x0+i*colW;dry+=`<rect x="${x}" y="${Y(t)}" width="${colW}" height="${Math.max(0,Yp(st.p[i])-Y(t))}" fill="#f2b134" opacity=".35"/>`;}});
  const anyDry=st.t.some((t,i)=>st.p[i]<2*t);
  if(anyDry)s+=hit("kuivakausi",`<g class="zone">${dry}</g>`,hl);
  // bars
  let bars="";st.p.forEach((p,i)=>{if(i>=upto)return;const x=x0+i*colW+4;bars+=`<rect x="${x}" y="${Yp(p)}" width="${colW-8}" height="${y0-Yp(p)}" fill="${p>100?"#1f4f9c":"#7fb3d5"}" stroke="#2757a8" stroke-width=".8"/>`;});
  s+=hit("sadepylvaat",`<g class="zone">${bars}</g>`,hl);
  // month columns (hit areas for months)
  st.t.forEach((t,i)=>{const x=x0+i*colW;s+=`<g class="hit" data-month="${i}" tabindex="0" role="button" aria-label="${MONF[i]}"><rect class="zone" x="${x}" y="${Y(topU)}" width="${colW}" height="${y0-Y(topU)}" fill="transparent" stroke="none"/></g>`+T(x+colW/2,y0+16,MON[i],{a:"middle",s:11,ax:true});});
  // temp line
  const pts=st.t.slice(0,upto).map((t,i)=>`${x0+i*colW+colW/2},${Y(t)}`).join(" ");
  s+=hit("lampokayra",`<polyline class="zone" points="${pts}" fill="none" stroke="transparent" stroke-width="16"/><polyline points="${pts}" fill="none" stroke="#d1452b" stroke-width="2.5" pointer-events="none"/>${st.t.slice(0,upto).map((t,i)=>`<circle cx="${x0+i*colW+colW/2}" cy="${Y(t)}" r="3" fill="#d1452b" pointer-events="none"/>`).join("")}`,hl);
  // title
  const mean=(st.t.reduce((a,b)=>a+b,0)/12).toFixed(1).replace(".",",");const sum=st.p.reduce((a,b)=>a+b,0);
  if(!o.hideTitle)s+=T(x0,24,`${st.name}  ${st.lat}, ${st.alt}`,{s:13,w:600,ax:true})+T(x0+W,24,`${mean} °C · ${sum} mm`,{a:"end",s:12,ax:true});
  else s+=T(x0,24,"Tuntematon asema",{s:13,w:600,ax:true});
  s+=T(x0,y0+34,"punainen käyrä = kuukauden keskilämpötila (vasen akseli) · siniset pylväät = sademäärä (oikea akseli, 1 °C = 2 mm)",{s:9.5,c:"#5b6b78",ax:true})+T(x0,y0+46,"keltainen = kuiva kausi: sadepylväs jää lämpökäyrän alle",{s:9.5,c:"#5b6b78",ax:true});
  return s+"</svg>";
};
